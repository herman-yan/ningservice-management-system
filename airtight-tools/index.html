<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>E-CAR 气密工装速查助手</title>
<style>
:root{
  --bg:#0d1117; --panel:#141b24; --panel2:#1a2230; --panel3:#212c3d;
  --border:#2a3646; --border2:#38465a;
  --text:#e8eef5; --muted:#9aa8b8; --dim:#6b7a8d;
  --accent:#38bdf8; --accent2:#22d3ee; --accentglow:rgba(56,189,248,.15);
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --disabled:#7c8a9c;
  --pn:#c4b5fd;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
/* 浅色主题：户外强光下更易读，与系统门户风格一致 */
html[data-theme="light"]{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2f8; --panel3:#e3e9f2;
  --border:#dce2ec; --border2:#c8d3e0;
  --text:#1f2a3a; --muted:#5b6b82; --dim:#8795a8;
  --accent:#2563eb; --accent2:#1d4ed8; --accentglow:rgba(37,99,235,.12);
  --good:#15803d; --warn:#b45309; --bad:#dc2626; --disabled:#94a3b8;
  --pn:#7c3aed;
  --shadow:0 6px 22px rgba(16,32,64,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;min-height:100vh;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 60px}

/* top nav */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 4px}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
  font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);transition:.15s}
.backlink:hover{color:var(--accent);border-color:var(--accent)}
.backlink svg{width:15px;height:15px}
.themebtn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;
  font-size:12.5px;padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel);transition:.15s}
.themebtn:hover{color:var(--accent);border-color:var(--accent)}
.themebtn svg{width:15px;height:15px}

/* header */
header{padding:0 0 14px;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px var(--accentglow)}
.logo svg{width:23px;height:23px}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.stats{margin-left:auto;display:flex;gap:16px;text-align:right}
.stat b{display:block;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--dim)}

/* search */
.searchbar{position:relative;margin:16px 0 6px}
.searchbar .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);width:20px;height:20px;pointer-events:none}
#q{width:100%;padding:14px 46px 14px 45px;border-radius:13px;
  background:var(--panel);border:1px solid var(--border2);color:var(--text);
  font-size:15px;outline:none;transition:.18s;box-shadow:var(--shadow)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentglow)}
#q::placeholder{color:var(--dim)}
.clearq{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;border:none;background:var(--panel3);
  color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px;line-height:1}
.clearq.show{display:flex}

/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0 18px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap}
.tab svg{width:16px;height:16px}
.tab:hover{border-color:var(--border2);color:var(--text)}
.tab.active{background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(37,99,235,.12));
  border-color:var(--accent);color:var(--accent)}

/* layout */
.cols{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
.single{display:block}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.panel-h{padding:12px 15px;border-bottom:1px solid var(--border);font-size:12px;
  color:var(--muted);font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.panel-h .cnt{margin-left:auto;background:var(--panel3);color:var(--accent);
  padding:1px 8px;border-radius:20px;font-size:11px;font-variant-numeric:tabular-nums}

/* project list */
.plist{max-height:620px;overflow-y:auto;padding:6px}
.plist::-webkit-scrollbar{width:7px}
.plist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
.pitem{padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px;
  display:flex;align-items:center;gap:8px;transition:.12s;border:1px solid transparent}
.pitem:hover{background:var(--panel2)}
.pitem.active{background:linear-gradient(135deg,rgba(56,189,248,.16),rgba(37,99,235,.08));
  border-color:rgba(56,189,248,.4);color:var(--accent)}
.pitem .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.pitem.active .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.pitem .n{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

/* filter chips */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.fchip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);font-size:12px;cursor:pointer;transition:.14s}
.fchip:hover{border-color:var(--border2);color:var(--text)}
.fchip.active{background:var(--accent);border-color:var(--accent);color:#06121c;font-weight:700}

/* result cards */
.result-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.result-title{font-size:15px;font-weight:700}
.result-title .hl{color:var(--accent)}
.result-sub{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:13px 15px;transition:.14s;position:relative;overflow:hidden}
.card:hover{border-color:var(--border2)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.7}
.card .row1{display:flex;align-items:flex-start;gap:10px}
.card .mat{font-size:14.5px;font-weight:650;flex:1;line-height:1.35}
.tag{font-size:10.5px;padding:3px 9px;border-radius:6px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.t-type{background:rgba(56,189,248,.14);color:var(--accent)}
.t-qty{background:rgba(251,191,36,.14);color:var(--warn)}
.card .meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.codes{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.code{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;font-size:12.5px}
.code .lab{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.3px}
.code.new .lab{background:rgba(52,211,153,.16);color:var(--good)}
.code.new .val{color:var(--good);font-weight:700;font-variant-numeric:tabular-nums}
.code.old .lab{background:rgba(124,138,156,.16);color:var(--disabled)}
.code.old .val{color:var(--disabled);text-decoration:line-through;font-variant-numeric:tabular-nums}
.code.pn .lab{background:rgba(167,139,250,.16);color:var(--pn)}
.code.pn .val{color:var(--pn);font-variant-numeric:tabular-nums}
.code .cp{border:none;background:none;color:var(--dim);cursor:pointer;padding:1px 2px;display:flex}
.code .cp:hover{color:var(--accent)}
.code .cp svg{width:13px;height:13px}
.remark{margin-top:10px;font-size:12px;color:var(--warn);display:flex;gap:7px;align-items:flex-start;
  background:rgba(251,191,36,.07);border-radius:7px;padding:7px 10px;border:1px solid rgba(251,191,36,.15)}
.remark svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px}
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:14px}
.empty .t{font-size:15px;color:var(--muted);margin-bottom:6px}
.empty .d{font-size:12.5px}
.relproj{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.relproj:hover{color:var(--accent2)}

/* watercool */
.wc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.wc{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  display:flex;align-items:center;gap:10px}
.wc .sz{font-weight:800;font-size:14px;padding:4px 9px;border-radius:7px;font-variant-numeric:tabular-nums}
.sz12{background:rgba(56,189,248,.16);color:var(--accent)}
.sz16{background:rgba(251,146,60,.16);color:#fb923c}
.wc .nm{font-size:12.5px;line-height:1.3}
.spec-box{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:14px;margin-bottom:16px}
.spec-box h3{margin:0 0 10px;font-size:13px;color:var(--accent)}
.spec-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;flex-wrap:wrap}
.spec-row:last-child{border:none}
.spec-row .sz{font-weight:800;min-width:52px}
.spec-row .val{color:var(--good);font-weight:600;font-variant-numeric:tabular-nums}
.spec-row .note{color:var(--dim);font-size:11.5px}

/* reverse lookup */
.lookup-tip{font-size:12px;color:var(--muted);margin-bottom:12px;padding:10px 13px;
  background:var(--panel2);border-radius:9px;border:1px solid var(--border)}
.mark{background:rgba(251,191,36,.25);color:#ffe9a8;border-radius:3px;padding:0 2px}

/* general tools */
.gsec{margin-bottom:18px}
.gsec h3{font-size:13.5px;margin:0 0 10px;color:var(--accent);display:flex;align-items:center;gap:8px}
.gsec h3 .bar{width:3px;height:15px;background:var(--accent);border-radius:2px}
.gtable{width:100%;border-collapse:collapse;font-size:12.5px}
.gtable th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:8px 10px;
  border-bottom:1px solid var(--border2);white-space:nowrap}
.gtable td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.gtable tr:last-child td{border-bottom:none}
.gtable tr:hover td{background:var(--panel2)}
.gtable .gid{color:var(--good);font-weight:600;font-variant-numeric:tabular-nums}
.gtable .gold{color:var(--disabled);text-decoration:line-through;font-variant-numeric:tabular-nums}
.gtable .gremark{color:var(--warn);font-size:11.5px}

.hint{font-size:11.5px;color:var(--dim);margin-top:6px;padding-left:2px}
kbd{background:var(--panel3);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--muted)}

@media(max-width:760px){
  .cols{grid-template-columns:1fr}
  .plist{max-height:210px}
  .stats{gap:14px}
  .stat b{font-size:15px}
  .stat span{font-size:9.5px}
  .brand h1{font-size:16px}
  .brand .sub{font-size:11px}
  .logo{width:36px;height:36px}
  .logo svg{width:20px;height:20px}
  #q{font-size:16px;padding:13px 42px 13px 42px}
  .tab{padding:9px 13px;font-size:12.5px}
  .card{padding:12px}
  .card .mat{font-size:14px}
  .code{padding:6px 9px;font-size:12px}
  .hint{display:none}
  header{padding-bottom:10px}
  .tabs{margin:12px 0 14px}
}
@media(max-width:400px){
  .stats{gap:9px}
  .stat b{font-size:13px}
  .stat span{font-size:8.5px}
  .tab{font-size:12px;padding:8px 11px}
  .backlink,.themebtn{font-size:11.5px;padding:6px 8px}
}
</style>
</head>

/* ---------- helpers ---------- */
function toHalf(s){return String(s||'').replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' ')}
function norm(s){return toHalf(s).toLowerCase().replace(/\s+/g,'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function projAliases(name){const p=DATA.projects.find(x=>x.name===name);return p?p.aliases.join(' '):''}

// precompute searchable text
DATA.records.forEach(r=>{
  r._s=norm([r.project,projAliases(r.project),r.category,r.vehiclePn,r.material,r.pn,r.newId,r.oldId,r.remark,r.alt,r.toolType].join('|'));
  r._code=norm([r.newId,r.oldId,r.pn,r.alt].join('|'));
});
DATA.projects.forEach(p=>{p._s=norm([p.name,p.aliases.join(' ')].join('|'));p._n=DATA.records.filter(r=>r.project===p.name).length});

/* ---------- render card ---------- */
function codeHtml(lab,val,cls){
  if(!val) return '';
  const valstr=String(val);
  return '<div class="code '+cls+'"><span class="lab">'+lab+'</span><span class="val">'+esc(valstr)+'</span>'+
    '<button class="cp" data-copy="'+esc(valstr)+'" title="复制">'+ICON.copy+'</button></div>';
}
function cardHtml(r,highlight){
  let mat=esc(r.material);
  if(highlight && state.q) mat=highlightText(mat,state.q);
  let h='<div class="card">';
  h+='<div class="row1"><div class="mat">'+mat+'</div>';
  if(r.toolType) h+='<span class="tag t-type">'+esc(r.toolType)+'</span>';
  h+='</div>';
  let metas=[];
  if(r.category) metas.push(esc(r.category));
  if(r.vehiclePn) metas.push('电箱PN '+esc(r.vehiclePn));
  if(r.project) metas.push('项目 '+esc(r.project));
  if(metas.length) h+='<div class="meta">'+metas.join(' · ')+'</div>';
  h+='<div class="codes">';
  h+=codeHtml('新码·优先',r.newId,'new');
  h+=codeHtml('旧码·禁用',r.oldId,'old');
  h+=codeHtml('PN',r.pn,'pn');
  if(r.qty) h+='<div class="code"><span class="lab" style="background:rgba(251,191,36,.14);color:var(--warn)">单套用量</span><span class="val" style="color:var(--warn)">'+esc(r.qty)+'</span></div>';
  h+='</div>';
  if(r.remark) h+='<div class="remark">'+ICON.warn+'<span>'+esc(r.remark).replace(/\n/g,'<br>')+'</span></div>';
  h+='</div>';
  return h;
}
function highlightText(text,q){
  const nq=norm(q); if(!nq) return text;
  // simple: find raw q substring case-insensitive
  const i=text.toLowerCase().indexOf(String(q).toLowerCase());
  if(i<0) return text;
  return text.slice(0,i)+'<span class="mark">'+text.slice(i,i+q.length)+'</span>'+text.slice(i+q.length);
}

function emptyHtml(t,d){return '<div class="empty">'+ICON.empty+'<div class="t">'+t+'</div><div class="d">'+(d||'')+'</div></div>'}

/* ---------- views ---------- */
function viewProject(){
  const q=state.q.trim();
  if(q){ return searchResultsView(searchRecords(q)); }
  let html='<div class="cols"><div class="panel"><div class="panel-h">项目 / 车型列表<span class="cnt">'+DATA.projects.length+'</span></div><div class="plist" id="plist">';
  DATA.projects.forEach(p=>{
    const active=p.name===state.project?' active':'';
    html+='<div class="pitem'+active+'" data-proj="'+esc(p.name)+'"><span class="dot"></span><span>'+esc(p.name)+'</span><span class="n">'+p._n+'</span></div>';
  });
  html+='</div></div><div>';
  if(state.project){
    let recs=DATA.records.filter(r=>r.project===state.project);
    const types=[...new Set(recs.map(r=>r.toolType).filter(Boolean))];
    if(state.types.size){recs=recs.filter(r=>state.types.has(r.toolType))}
    html+='<div class="result-head"><div class="result-title">'+esc(state.project)+'</div><div class="result-sub">共 '+recs.length+' 项工装</div></div>';
    html+='<div class="filters"><span class="fchip'+(state.types.size===0?' active':'')+'" data-type="">全部</span>';
    types.forEach(t=>{html+='<span class="fchip'+(state.types.has(t)?' active':'')+'" data-type="'+esc(t)+'">'+esc(t)+'</span>'});
    html+='</div>';
    // watercool info for this project
    const wcs=DATA.watercool.filter(w=>norm(w.project).includes(norm(state.project))||norm(state.project).includes(norm(w.project)));
    if(wcs.length){
      const sizes=[...new Set(wcs.map(w=>w.size))];
      html+='<div class="spec-box" style="padding:10px 13px;margin-bottom:12px"><span style="color:var(--muted);font-size:12px">水冷板口径：</span>'+sizes.map(sz=>'<span class="sz '+(sz.includes('12')?'sz12':'sz16')+'" style="display:inline-block;margin-left:6px">'+esc(sz)+'</span>').join('')+' <span style="color:var(--dim);font-size:11px">('+wcs.map(w=>esc(w.project)).join(', ')+')</span></div>';
    }
    if(recs.length){html+='<div class="cards">'+recs.map(r=>cardHtml(r)).join('')+'</div>'}
    else{
      // no tooling records — but this project may still have caliber data. Show it, plus related-project hint.
      let msg='该筛选下暂无工装';
      let sub='试试切换工具类型';
      if(state.types.size===0){
        if(wcs.length){msg='该项目仅有水冷板口径数据，暂无工装明细';sub='可在「按口径尺寸」页查看更多口径匹配'}
        // find related project sharing a strong alias (e.g. A5H <-> GAC_A5H)
        const np=DATA.projects.find(p=>p.name===state.project);
        const strong=(np?np.aliases:[]).filter(a=>a.length>=3&&/^[A-Za-z0-9]+$/.test(a));
        let rel=[];
        DATA.projects.forEach(p=>{
          if(p.name===state.project||p._n===0)return;
          if(strong.some(a=>p.aliases.includes(a)||norm(p.name).includes(norm(a)))) rel.push(p.name);
        });
        rel=[...new Set(rel)].slice(0,6);
        if(rel.length){sub+=' · 相关项目：<span class="relproj" data-proj="'+esc(rel[0])+'">'+esc(rel[0])+'</span>';}
      }
      html+=emptyHtml(msg,sub);
    }
  }else{
    html+=emptyHtml('← 请从左侧选择一个项目','或直接在顶部搜索框输入关键词');
  }
  html+='</div></div>';
  return html;
}

function searchRecords(q){
  const nq=norm(q);
  return DATA.records.filter(r=>r._s.includes(nq));
}
function searchGeneral(q){
  const nq=norm(q);
  const out=[];
  DATA.general && Object.keys(DATA.general).forEach(k=>{
    DATA.general[k].forEach(g=>{
      const s=norm(Object.values(g).join('|'));
      if(s.includes(nq)) out.push({group:k,...g});
    });
  });
  return out;
}
function searchSpecial(q){
  const nq=norm(q);
  return DATA.special.filter(s=>norm(Object.values(s).join('|')+JSON.stringify(s.usage)).includes(nq));
}
function searchResultsView(recs){
  const gen=searchGeneral(state.q), sp=searchSpecial(state.q);
  const total=recs.length+gen.length+sp.length;
  let h='<div class="result-head"><div class="result-title">搜索结果 <span class="hl">“'+esc(state.q)+'”</span></div><div class="result-sub">命中 '+total+' 项</div></div>';
  if(!total) return h+emptyHtml('没有找到匹配的工装','换个关键词试试，如项目名、口径(12mm)或标识码');
  if(recs.length){
    h+='<div class="result-sub" style="margin:6px 0 10px">▸ 工装清单（'+recs.length+'）</div><div class="cards">'+recs.slice(0,120).map(r=>cardHtml(r,true)).join('')+'</div>';
    if(recs.length>120) h+='<div class="hint">仅显示前 120 条，建议缩小关键词范围</div>';
  }
  if(gen.length){
    h+='<div class="result-sub" style="margin:18px 0 10px">▸ 通用工具（'+gen.length+'）</div>'+generalTable(gen,true);
  }
  if(sp.length){
    h+='<div class="result-sub" style="margin:18px 0 10px">▸ 特殊工具（'+sp.length+'）</div><div class="cards">'+sp.map(s=>specialCard(s)).join('')+'</div>';
  }
  return h;
}

function viewCaliber(){
  const q=state.q.trim();
  if(q){ return searchResultsView(searchRecords(q)); }
  let h='<div class="filters"><span class="fchip'+(state.caliber==='all'?' active':'')+'" data-cal="all">全部口径</span>'+
    '<span class="fchip'+(state.caliber==='12'?' active':'')+'" data-cal="12">12mm</span>'+
    '<span class="fchip'+(state.caliber==='16'?' active':'')+'" data-cal="16">16mm</span></div>';
  h+='<div class="spec-box"><h3><span class="bar" style="display:inline-block;width:3px;height:14px;background:var(--accent);border-radius:2px;margin-right:6px"></span>口径 ↔ 堵头型号对照</h3>';
  const spec12=['PT-241-014-0018（国产）/ PT-241-014-0019（进口）→ 新码 12-01-05-000751，封堵口径12mm','PT-113-007-0101（国产）→ 新码 12-01-05-000248，封堵口径12mm'];
  const spec16=['PT-113-007-0001（进口）→ 新码 12-01-05-000248，封堵口径16mm','水冷气密工装内径φ16（见各项目记录）'];
  h+='<div class="spec-row"><span class="sz sz12">12mm</span><span>'+spec12.join('<br>')+'</span></div>';
  h+='<div class="spec-row"><span class="sz sz16">16mm</span><span>'+spec16.join('<br>')+'</span></div>';
  h+='</div>';
  let wcs=DATA.watercool;
  if(state.caliber!=='all') wcs=wcs.filter(w=>w.size.includes(state.caliber));
  h+='<div class="panel"><div class="panel-h">项目 / 车型 口径清单<span class="cnt">'+wcs.length+'</span></div><div style="padding:13px"><div class="wc-grid">';
  wcs.forEach(w=>{
    const cls=w.size.includes('12')?'sz12':'sz16';
    h+='<div class="wc"><span class="sz '+cls+'">'+esc(w.size)+'</span><span class="nm">'+esc(w.project)+'</span></div>';
  });
  h+='</div></div></div>';
  return h;
}

function viewCode(){
  const q=state.q.trim();
  if(q){
    const recs=DATA.records.filter(r=>r._code.includes(norm(q)));
    return codeQueryResult(q,recs);
  }
  return '<div class="lookup-tip">输入你手中的 <b style="color:var(--good)">新标识码</b>、<b style="color:var(--disabled)">旧标识码</b> 或 <b style="color:#c4b5fd">PN</b>，反查它是什么工装、适用哪些项目、有无新码替代。支持只输入号码片段。</div>'+
    emptyHtml('在顶部搜索框输入标识码 / PN','例如 360141-00111 或 PT-341-022-0132');
}
function codeQueryResult(q,recs){
  const gen=searchGeneral(q), sp=searchSpecial(q);
  const total=recs.length+gen.length+sp.length;
  let h='<div class="result-head"><div class="result-title">码值反查 <span class="hl">“'+esc(q)+'”</span></div><div class="result-sub">命中 '+total+' 项</div></div>';
  if(!total) return h+emptyHtml('没有找到该标识码','请确认号码，或尝试输入部分数字');
  if(recs.length) h+='<div class="cards">'+recs.map(r=>cardHtml(r,true)).join('')+'</div>';
  if(gen.length) h+='<div style="margin-top:16px">'+generalTable(gen,true)+'</div>';
  if(sp.length) h+='<div class="cards" style="margin-top:12px">'+sp.map(s=>specialCard(s)).join('')+'</div>';
  return h;
}

const GNAME={sealed:'气密性测试设备',can:'CAN卡和OBD调试线束',pack:'Pack级调试线束',other:'其他工具'};
function generalTable(rows,withHead){
  const grouped={};
  rows.forEach(g=>{(grouped[g.group]=grouped[g.group]||[]).push(g)});
  let h='';
  Object.keys(grouped).forEach(k=>{
    h+='<div class="gsec"><h3><span class="bar"></span>'+(GNAME[k]||k)+'</h3><div class="panel" style="overflow-x:auto"><table class="gtable"><thead><tr>'+
      '<th>名称</th><th>PN / 规格</th><th>新标识码（优先）</th><th>旧标识码（禁用）</th><th>备注</th></tr></thead><tbody>';
    grouped[k].forEach(g=>{
      h+='<tr><td>'+esc(g.name||g.id||'')+'</td><td>'+esc(g.pn||g.pin||'')+'</td>'+
        '<td class="gid">'+(g.newId?esc(g.newId).replace(/\n/g,'<br>'):'—')+'</td>'+
        '<td class="gold">'+(g.oldId?esc(g.oldId).replace(/\n/g,'<br>'):'—')+'</td>'+
        '<td class="gremark">'+esc(g.remark||'').replace(/\n/g,'<br>')+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  return h;
}
function viewGeneral(){
  if(state.q.trim()) return searchResultsView(searchRecords(state.q));
  return generalTable(Object.keys(DATA.general).flatMap(k=>DATA.general[k].map(g=>({group:k,...g}))));
}

function specialCard(s){
  let h='<div class="card"><div class="row1"><div class="mat">'+esc(s.name)+(s.type?' <span style="color:var(--dim);font-size:11px;font-weight:400">· '+esc(s.type)+'</span>':'')+'</div></div>';
  if(s.apply||s.remark){h+='<div class="meta">'+esc([s.apply,s.remark].filter(Boolean).join(' · '))+'</div>'}
  h+='<div class="codes">'+codeHtml('新码·优先',s.new,'new')+codeHtml('旧码/型号',s.old,'pn')+'</div>';
  const us=Object.entries(s.usage||{}).filter(([k,v])=>v);
  if(us.length){h+='<div class="meta" style="margin-top:9px">各项目用量：'+us.map(([k,v])=>esc(k)+' <b style="color:var(--warn)">'+esc(v)+'</b>').join(' · ')+'</div>'}
  h+='</div>';return h;
}
function viewSpecial(){
  if(state.q.trim()) return searchResultsView(searchRecords(state.q));
  return '<div class="result-sub" style="margin-bottom:12px">按项目统计的一套 Pack 堵头用量（来自「特殊工具清单汇总」）</div><div class="cards">'+DATA.special.map(s=>specialCard(s)).join('')+'</div>';
}

/* ---------- mount ---------- */
function render(){
  const app=document.getElementById('app');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.tab));
  if(state.tab==='project') app.innerHTML=viewProject();
  else if(state.tab==='caliber') app.innerHTML=viewCaliber();
  else if(state.tab==='code') app.innerHTML=viewCode();
  else if(state.tab==='general') app.innerHTML=viewGeneral();
  else if(state.tab==='special') app.innerHTML=viewSpecial();
  bindDynamic();
}

function bindDynamic(){
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const v=b.getAttribute('data-copy');
    navigator.clipboard && navigator.clipboard.writeText(v).then(()=>{
      b.style.color='var(--good)';setTimeout(()=>b.style.color='',900);
    });
  }));
  document.querySelectorAll('[data-proj]').forEach(el=>el.addEventListener('click',()=>{
    state.project=el.getAttribute('data-proj');state.types.clear();render();
  }));
  document.querySelectorAll('[data-type]').forEach(el=>el.addEventListener('click',()=>{
    const t=el.getAttribute('data-type');
    if(!t){state.types.clear()}else{state.types.has(t)?state.types.delete(t):state.types.add(t)}
    render();
  }));
  document.querySelectorAll('[data-cal]').forEach(el=>el.addEventListener('click',()=>{
    state.caliber=el.getAttribute('data-cal');render();
  }));
}

document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  state.tab=t.dataset.tab;state.q='';document.getElementById('q').value='';document.getElementById('clearq').classList.remove('show');render();
});

const qi=document.getElementById('q'), cq=document.getElementById('clearq');
qi.addEventListener('input',()=>{state.q=qi.value;cq.classList.toggle('show',!!qi.value);render()});
cq.addEventListener('click',()=>{qi.value='';state.q='';cq.classList.remove('show');render();qi.focus()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==qi){e.preventDefault();qi.focus()}});

/* theme toggle (persisted) */
(function(){
  var saved=null;try{saved=localStorage.getItem('airtight_theme')}catch(e){}
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    var light=t==='light';
    document.getElementById('themeLabel').textContent=light?'深色模式':'浅色模式';
    document.getElementById('themeIcon').innerHTML=light
      ?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
      :'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  }
  apply(saved||'dark');
  document.getElementById('themeBtn').addEventListener('click',function(){
    var next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    apply(next);try{localStorage.setItem('airtight_theme',next)}catch(e){}
  });
})();

document.getElementById('s1').textContent=DATA.meta.recordCount;
document.getElementById('s2').textContent=DATA.meta.projectCount;
document.getElementById('s3').textContent=DATA.watercoolSizes.length;
render();
</script>
</body>
