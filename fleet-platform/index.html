<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="iService 车队管理平台 · 新能源重卡车队与电池监控（复刻演示）">
<title>控制台 · iService 车队管理平台</title>
<style>
/* ===== iService 车队管理平台 · 现代视觉体系 ===== */
:root{
  --brand:#124a89; --nav:#2f7de1; --nav-dark:#1f66c9; --cyan:#38a8e0;
  --side:#142338; --side-deep:#111e31; --side-on:#1d3552;
  --bg:#f3f6fa;
  --orange:#f59e0b; --green:#10a37f; --red:#e5484d; --blue:#2f7de1;
  --txt:#1f2b3d; --txt-2:#475569; --muted:#8493a6; --line:#e6ecf3;
  --stat-title:#6c8199; --stat-num:#1c6bc4;
  --shadow:0 1px 2px rgba(20,45,80,.04), 0 6px 20px rgba(20,45,80,.055);
  --shadow-lg:0 12px 32px rgba(20,45,80,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:13px/1.55 "Inter","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
svg{display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd7e4;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#aabdd1;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶部栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;z-index:60;
  background:#16528f;
  box-shadow:0 2px 14px rgba(12,40,80,.18)}
.brand{flex:0 0 210px;width:210px;background:rgba(8,30,62,.38);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:19px;font-weight:600;letter-spacing:.4px;cursor:pointer;user-select:none;
  border-right:1px solid rgba(255,255,255,.13)}
.brand i{font-style:normal;font-weight:400}
.tb-tabs{display:flex;background:transparent;align-items:center}
.tb-tab{display:flex;align-items:center;gap:8px;padding:0 17px;height:34px;margin:0 3px;color:rgba(255,255,255,.93);
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;border-radius:9px;transition:background .15s,color .15s}
.tb-tab svg{width:15px;height:15px;opacity:.95}
.tb-tab:hover{background:rgba(255,255,255,.14);color:#fff}
.tb-tab.on{background:rgba(255,255,255,.22);color:#fff}
.tb-fill{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding-right:14px;color:#fff}
.tb-ico{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;cursor:pointer;position:relative;
  color:#fff;transition:background .15s}
.tb-ico:hover{background:rgba(255,255,255,.18)}
.tb-ico svg{width:17px;height:17px}
.tb-ico .dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:#f0484d;color:#fff;font-size:10px;line-height:15px;text-align:center;font-weight:600;
  box-shadow:0 0 0 2px rgba(22,82,143,.9)}
.tb-sep{width:1px;height:20px;background:rgba(255,255,255,.32);margin:0 8px}
.tb-user{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;cursor:pointer;font-size:12.5px;
  border-radius:9px;transition:background .15s}
.tb-user:hover{background:rgba(255,255,255,.16)}
.avatar{width:27px;height:27px;border-radius:50%;background:#fff;color:#1b6ec2;display:grid;place-items:center;
  font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.tb-user .cvv{width:12px;height:12px;opacity:.9}

.dropdown{position:absolute;top:50px;right:14px;min-width:202px;background:#fff;
  box-shadow:0 14px 38px rgba(16,40,75,.2);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:70;
  color:#3f4a53;display:none}
.dropdown.show{display:block}
.dropdown .di{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:12.5px;cursor:pointer;border-radius:8px}
.dropdown .di:hover{background:#f1f7ff;color:#1f66c9}
.dropdown .di svg{width:14px;height:14px;opacity:.7}
.dropdown .dh{padding:9px 12px 11px;border-bottom:1px solid #eef2f7;font-size:12px;color:#8493a6}
.dropdown .dh b{display:block;font-size:13px;color:#1f2b3d;font-weight:650;margin-bottom:2px}

/* ===== 侧栏 ===== */
.sidebar{position:fixed;top:54px;left:0;bottom:0;width:210px;z-index:50;overflow-y:auto;
  background:#142338;border-right:1px solid rgba(255,255,255,.05)}
.tenant{height:60px;margin:12px 10px 6px;border-radius:11px;display:flex;align-items:center;gap:9px;padding:0 11px;
  color:#fff;cursor:pointer;background:#2f7de1;
  box-shadow:0 3px 10px rgba(20,80,150,.18);transition:filter .15s,transform .15s}
.tenant:hover{filter:brightness(1.07);transform:translateY(-1px)}
.tenant .sq{width:31px;height:31px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;
  font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.4);flex:0 0 31px}
.tenant .nm{font-size:12.5px;line-height:1.25;font-weight:650}
.tenant .sb{font-size:10.5px;opacity:.9;line-height:1.25}
.tenant .cv{margin-left:auto;width:12px;height:12px;opacity:.9}
.nav-group{font-size:10.5px;color:#6c829c;padding:18px 18px 8px;letter-spacing:1.2px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;height:41px;margin:2px 10px;padding-left:13px;border-radius:9px;
  color:#a3b4c8;font-size:13px;cursor:pointer;border-left:0;transition:background .15s,color .15s}
.nav-item svg{width:17px;height:17px;opacity:.85;flex:0 0 17px;stroke-width:1.85}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item:hover svg{opacity:1}
.nav-item.on{background:rgba(47,125,225,.28);color:#fff;
  box-shadow:inset 3px 0 0 #57a9f5;font-weight:600}
.nav-item.on svg{opacity:1;color:#8fc8ff}
.nav-item .badge{margin-left:auto;margin-right:12px;background:#e5484d;color:#fff;font-size:10.5px;line-height:16px;
  padding:0 5px;border-radius:8px;font-weight:600}
.side-foot{padding:16px 18px 22px;font-size:11px;color:#5f7390;line-height:1.75}

/* ===== 主区 ===== */
.main{margin-left:210px;padding-top:54px;min-height:100vh}
.page{padding:20px 22px 40px;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;gap:12px;padding:2px 2px 16px}
.page-head h1{margin:0;font-size:24px;font-weight:650;color:#1b2940;line-height:1.2;letter-spacing:-.3px}
.page-head .sub{font-size:12.5px;color:#8493a6;padding-bottom:4px}
.page-head .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:12px;color:#5f7289;padding-bottom:4px}
.page-head .right .lk{display:flex;align-items:center;gap:5px;cursor:pointer;transition:color .15s}
.page-head .right .lk:hover{color:#1f66c9}
.page-head .right svg{width:13px;height:13px}

/* ===== 控制台统计卡 ===== */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{display:flex;background:#fff;height:96px;border-radius:12px;border:1px solid var(--line);
  box-shadow:var(--shadow);cursor:pointer;overflow:hidden;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#cbdff5}
.stat .tile{flex:0 0 40%;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.stat .tile svg{width:30px;height:30px;stroke-width:1.8;position:relative;z-index:1}
/* 科技感图标：精密几何主体 + 主辅层次（HUD 准星 / 焊接节点），纯色无渐变 */
.stat .tile svg.ico-tech{stroke-width:1.9}
.ico-tech .hud{opacity:.38}
.ico-tech .nd{opacity:.68}
.stat .txt{flex:1;min-width:0;padding:12px 12px 10px;display:flex;flex-direction:column;
  justify-content:flex-start;overflow:hidden}
.stat .tt{font-size:12.5px;color:var(--stat-title);font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.45}
.stat .vv{font-size:25px;font-weight:750;color:var(--stat-num);line-height:1.18;margin-top:2px;
  letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat .ml{font-size:11.5px;line-height:1.55;color:#7c8da1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .ml b{font-weight:400;color:#7c8da1}
.stat .ml .g{color:var(--green);font-weight:600}
.stat .ml .o{color:#d9820b;font-weight:600}
.c-orange{background:#f0a01e}
.c-green{background:#10a37f}
.c-red{background:#e05257}
.c-blue{background:#2f7de1}
.dash-foot{display:flex;align-items:center;gap:16px;padding:16px 3px 0;font-size:12px;color:#8493a6}
.dash-foot .lp{display:flex;align-items:center;gap:6px;cursor:pointer;color:#1f66c9;font-weight:500}
.dash-foot .lp:hover{text-decoration:underline}
.dash-foot svg{width:13px;height:13px}

/* ===== 通用盒子 ===== */
.box{background:#fff;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:16px;border-top:3px solid #e1e9f2}
.box.blue{border-top-color:var(--nav)}
.box.green{border-top-color:var(--green)}
.box-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);
  font-size:13.5px;font-weight:650;color:#24364d}
.box-hd .t{display:flex;align-items:center;gap:7px}
.box-hd .t svg{width:15px;height:15px;color:#7c93ad}
.box-hd .r{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#8493a6}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:13px 16px;
  border-bottom:1px solid var(--line);background:#fcfdff}
.toolbar .sp{flex:1}
.toolbar .lb{font-size:12.5px;color:#74869c;margin-left:2px}

/* ===== 表单控件 ===== */
.inp,.sel{height:34px;border:1px solid #dfe7f0;border-radius:8px;padding:0 11px;font-size:12.5px;
  color:#33445b;background:#fff;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.inp{min-width:150px}
.sel{min-width:112px;cursor:pointer;padding-right:6px}
.inp:focus,.sel:focus{border-color:#4b91e0;box-shadow:0 0 0 3px rgba(47,125,225,.12)}
.inp::placeholder{color:#a9b7c6}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap svg{position:absolute;left:10px;width:13px;height:13px;color:#9aabbe;pointer-events:none}
.search-wrap .inp{padding-left:29px}
.btn{height:34px;padding:0 13px;border:1px solid #dfe7f0;background:#fff;color:#42546b;font-size:12.5px;
  font-weight:500;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn svg{width:13px;height:13px}
.btn:hover{background:#f3f8ff;border-color:#b9d2f0;color:#1f66c9}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:#2f7de1;border-color:#2f7de1;color:#fff;
  box-shadow:0 2px 7px rgba(31,102,201,.18)}
.btn-primary:hover{background:#1f66c9;border-color:#1f66c9;color:#fff}
.btn-success{background:#10a37f;border-color:#10a37f;color:#fff}
.btn-success:hover{background:#0a7f60;color:#fff}
.btn-warn{background:#f0a01e;border-color:#f0a01e;color:#fff}
.btn-warn:hover{background:#dd7e06;color:#fff}
.btn-danger{background:#fff;border-color:#f2c3c4;color:#cf3c42}
.btn-danger:hover{background:#fff5f5;border-color:#e99a9e;color:#b83036}
.btn-xs{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn-lg{height:36px;padding:0 16px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ===== 表格 ===== */
.tb-scroll{overflow:auto;max-height:calc(100vh - 330px)}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{background:#f8fafc;color:#62748c;font-weight:600;font-size:12px;letter-spacing:.2px;text-align:left;
  padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.tb th.num,.tb td.num{text-align:right}
.tb th.ctr,.tb td.ctr{text-align:center}
.tb td{padding:10px 14px;border-bottom:1px solid #f0f4f8;color:#40506a;vertical-align:middle}
.tb tbody tr:hover td{background:#f5f9ff}
.tb tbody tr.clickable{cursor:pointer}
.tb .mono{font-family:"SFMono-Regular",Consolas,"Courier New",monospace;font-size:12px;color:#5c7086;letter-spacing:.2px}
.tb .mut{color:#9aa9ba}
.tb .b{font-weight:650;color:#22354c}
.tb .empty{text-align:center;padding:54px 0;color:#9aa9ba;font-size:13px}
.tb .empty svg{width:34px;height:34px;margin:0 auto 8px;color:#c9d7e5}
.row-warn td{background:#fffbf2 !important}
.row-danger td{background:#fff6f6 !important}
.pager{display:flex;align-items:center;gap:6px;padding:12px 16px;border-top:1px solid var(--line);
  font-size:12.5px;color:#74869c;flex-wrap:wrap;background:#fcfdff}
.pager .cnt{margin-right:auto}
.pager .pg{min-width:30px;height:30px;padding:0 8px;display:grid;place-items:center;border:1px solid #e1e9f2;
  border-radius:8px;cursor:pointer;background:#fff;color:#4d6079;font-size:12.5px;transition:all .15s}
.pager .pg:hover{border-color:#8ab6ea;color:#1f66c9;background:#f4f9ff}
.pager .pg.on{background:#2f7de1;border-color:#2f7de1;color:#fff;font-weight:600;
  box-shadow:0 2px 6px rgba(31,102,201,.2)}
.pager .pg.dis{opacity:.4;pointer-events:none}
.pager .sz{display:flex;align-items:center;gap:6px;margin-left:8px}
.pager .sz .sel{height:28px;min-width:64px;font-size:12px;border-radius:7px}

/* ===== KPI 小卡 ===== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;padding:15px 16px;border-radius:12px;border:1px solid var(--line);
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--nav)}
.kpi.g::before{background:var(--green)} .kpi.o::before{background:var(--orange)} .kpi.r::before{background:var(--red)}
.kpi .k{font-size:12px;color:#7c8da1;font-weight:500}
.kpi .v{font-size:26px;font-weight:750;color:#1d2f47;margin-top:3px;line-height:1.2;
  letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:#9aa9bb;margin-top:3px}

/* ===== 标签 ===== */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;line-height:17px;
  font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-g{background:#e8f8f1;color:#0b8a63;border-color:#d3f0e2}
.p-o{background:#fff5e3;color:#b37209;border-color:#fae6c2}
.p-r{background:#fdefef;color:#c8393f;border-color:#f7d8d9}
.p-b{background:#eaf3ff;color:#2369be;border-color:#d5e7fc}
.p-gray{background:#f1f4f8;color:#6b7d92;border-color:#e6ebf1}
.p-t{background:#e6f7fa;color:#0d7a87;border-color:#cfedf2}

/* ===== 页级标签页 ===== */
.tabs{display:flex;gap:4px;padding:0 14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.tab{padding:12px 15px;font-size:13px;color:#6b7d92;cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;transition:color .15s}
.tab:hover{color:#1f66c9}
.tab.on{color:#1f66c9;border-bottom-color:var(--nav);font-weight:650}
.tab .n{font-size:11.5px;color:#a3b1c2;margin-left:4px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 13px;border:1px solid #dfe7f0;background:#fff;border-radius:999px;font-size:12px;
  font-weight:500;color:#63768c;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#8ab6ea;color:#1f66c9;background:#f6faff}
.chip.on{background:#2f7de1;border-color:#2f7de1;color:#fff;
  box-shadow:0 2px 7px rgba(31,102,201,.18)}

/* ===== 抽屉 ===== */
.ov{position:fixed;inset:0;background:rgba(12,26,45,.44);z-index:80;opacity:0;pointer-events:none;
  transition:opacity .22s;backdrop-filter:blur(2px)}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:660px;max-width:96vw;background:#fff;z-index:81;
  display:flex;flex-direction:column;transform:translateX(101%);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow:-14px 0 44px rgba(12,32,60,.2);border-radius:18px 0 0 18px;overflow:hidden}
.drawer.show{transform:none}
.dw-hd{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;
  background:#fff}
.dw-hd h3{margin:0;font-size:18px;font-weight:700;color:#1b2940;line-height:1.3;letter-spacing:-.2px}
.dw-hd .sub{font-size:12px;color:#8493a6;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dw-x{margin-left:auto;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;cursor:pointer;
  color:#8493a6;flex:0 0 30px;transition:all .15s}
.dw-x:hover{background:#eef3f9;color:#d94349}
.dw-x svg{width:15px;height:15px}
.dw-tabs{display:flex;gap:3px;padding:0 14px;border-bottom:1px solid var(--line);background:#fafcff;overflow-x:auto}
.dw-tab{padding:11px 13px;font-size:12.5px;color:#6b7d92;cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;transition:color .15s}
.dw-tab:hover{color:#1f66c9}
.dw-tab.on{color:#1f66c9;border-bottom-color:var(--nav);font-weight:650}
.dw-bd{flex:1;overflow:auto;padding:18px 20px 36px}
.dw-ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafcff}

/* 字段表 */
.sec{margin-bottom:20px}
.sec-t{font-size:13px;font-weight:650;color:#24364d;padding-left:10px;border-left:3px solid var(--nav);
  border-radius:2px;margin-bottom:12px;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 16px}
.f{display:flex;gap:8px;font-size:12.5px;line-height:1.65;min-width:0}
.f .k{color:#8493a6;flex:0 0 84px}
.f .v{color:#40506a;min-width:0;word-break:break-all}
.f.full{grid-column:1/-1}
.f .v .mono{font-size:12px}

/* 电池面板 */
.batt{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.batt .ring{display:grid;place-items:center}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric{background:#f8fafc;border:1px solid #eaf0f6;padding:9px 11px;border-radius:9px}
.metric .k{font-size:11.5px;color:#8493a6}
.metric .v{font-size:15px;font-weight:700;color:#22354c;font-variant-numeric:tabular-nums}
.metric .v small{font-size:11px;font-weight:400;color:#8493a6;margin-left:2px}
.metric.warn{background:#fffaf0;border-color:#f7e3bb}
.metric.bad{background:#fdf4f3;border-color:#f3d3ce}

/* 图例 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#6b7d92;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}

/* ===== 地图页 ===== */
.map-layout{display:grid;grid-template-columns:296px minmax(0,1fr);gap:14px;align-items:start}
.map-main{min-width:0}
.map-side .box{margin-bottom:14px}
.vlist{max-height:calc(100vh - 310px);overflow:auto}
.vrow{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid #f0f4f8;cursor:pointer;

<body>
<div id="app"></div>
<script>
/* ============================================================
   iService 车队管理平台 · 数据层
   —— 全部数据由固定种子确定性生成，刷新不变，便于演示与复核
   ============================================================ */

const BRAND = {
  product: 'iService',
  platform: '车队管理平台',
  tenant: '××汽车服务有限公司',
  tenantShort: '××汽车服务',
  dept: '重卡维保事业部',
  user: '演示账号',
  role: '企业管理员',
  today: '2026-11-22'
};

/* ---------- 确定性随机 ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R = mulberry32(20261122);
const rf = () => R();
const ri = (a,b) => a + Math.floor(R()*(b-a+1));
const pick = arr => arr[Math.floor(R()*arr.length)];
const chance = p => R() < p;

function pad(n,l){ n = String(n); while(n.length<l) n='0'+n; return n; }
function fmt(n){ return (n==null||n==='')?'—':Number(n).toLocaleString('zh-CN'); }
function money(n){ return '¥' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function d2(n){ return pad(n,2); }
const DAY = 864e5;
const BASE = new Date(2026,10,22,9,30,0);
function dateStr(d){ return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate()); }
function dtStr(d){ return dateStr(d)+' '+d2(d.getHours())+':'+d2(d.getMinutes()); }
function daysBetween(a,b){ return Math.round((b-a)/DAY); }
function shift(days,h){ const d=new Date(BASE); d.setDate(d.getDate()+days); if(h!=null) d.setHours(h); return d; }
function relDate(days){ return dateStr(shift(days)); }

/* ---------- 23 家分公司 ---------- */
const CITY_DEF = [
  ['唐山','河北省','冀B'],['鄂尔多斯','内蒙古自治区','蒙K'],['榆林','陕西省','陕K'],
  ['天津','天津市','津A'],['石家庄','河北省','冀A'],['包头','内蒙古自治区','蒙B'],
  ['太原','山西省','晋A'],['邯郸','河北省','冀D'],['保定','河北省','冀F'],
  ['沧州','河北省','冀J'],['大同','山西省','晋B'],['呼和浩特','内蒙古自治区','蒙A'],
  ['张家口','河北省','冀G'],['临汾','山西省','晋L'],['忻州','山西省','晋H'],
  ['乌海','内蒙古自治区','蒙C'],['长治','山西省','晋D'],['秦皇岛','河北省','冀C'],
  ['西安','陕西省','陕A'],['银川','宁夏回族自治区','宁A'],['郑州','河南省','豫A'],
  ['济南','山东省','鲁A'],['临沂','山东省','鲁Q']
];
const BRANCH_WEIGHT = [300,255,205,200,190,175,168,160,152,140,132,128,118,108,96,88,80,74,70,62,145,104,76];
const SURNAME = '王李张刘陈杨赵黄周吴徐孙胡朱高林何郭马罗梁宋郑谢韩唐冯于董萧程曹袁邓许傅沈曾彭吕苏卢蒋蔡贾丁魏薛叶阎余潘杜戴夏钟汪田任姜范方石姚谭廖邹熊金陆郝孔白崔康毛邱秦江史顾侯邵孟龙万段雷钱汤尹黎易常武乔贺赖龚文'.split('');
const GIVEN = ['建国','志强','海军','晓东','文杰','国庆','永刚','立军','春生','宏伟','俊峰','振华','德明','少华','宝珠','长海','玉林','三喜','红兵','卫东','小刚','永强','宗明','金锁','来福','秀山','明辉','大勇','子豪','宇航','嘉诚','天宇','浩楠','泽宇','思远','文博','建军','利民','新民','振国','继东','凤山','占军','丙坤','怀玉','栓柱','二勇','满仓','有才','福生','连生'];
const SERVICE_BRANDS = ['驰加','途虎','中策','德邦','瑞丰','恒信','鑫源','宏图','正大','合力','天弘','安泰','嘉运','众诚','远大'];
const STATION_TYPE = ['加盟服务站','直营服务站','合作服务站'];

/* ---------- 按权重取整分配，保证总量精确 ---------- */
function alloc(total, weights){
  const sum = weights.reduce((a,b)=>a+b,0);
  const raw = weights.map(w=>total*w/sum);
  const out = raw.map(v=>Math.floor(v));
  let left = total - out.reduce((a,b)=>a+b,0);
  const order = raw.map((v,i)=>({i,f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f);
  for(let k=0;k<left;k++) out[order[k%order.length].i]++;
  return out;
}

const TOTAL = { branch:23, vehicle:3403, tractor:1608, trailer:1795, trailerBox:2698, driver:4780, station:281,
  maintOrder:30425, repairOrder:116044, maintFirst:231, maintSecond:266, repairFirst:1765, repairSecond:2781,
  licSoon:3074, trailerLicSoon:146, jqSoon:2826, sySoon:2808, driverLicSoon:1723 };

const BRANCHES = (()=>{
  const vAlloc = alloc(TOTAL.vehicle, BRANCH_WEIGHT);
  const tAlloc = alloc(TOTAL.driver, BRANCH_WEIGHT.map(w=>w*1.05+ri(0,9)));
  const bAlloc = alloc(TOTAL.trailerBox, BRANCH_WEIGHT.map(w=>w*0.95+ri(0,7)));
  const sAlloc = alloc(TOTAL.station, BRANCH_WEIGHT.map(w=>w*0.55+ri(0,5)));
  const list = CITY_DEF.map((c,i)=>({
    id:'BR'+pad(i+1,3), city:c[0], province:c[1], plate:c[2],
    name:c[0]+'分公司',
    leader:pick(SURNAME)+pick(GIVEN),
    phone:'1'+pick(['3','5','7','8','9'])+pad(ri(0,999999999),9).slice(0,9),
    vehicles:vAlloc[i], trailers:bAlloc[i], drivers:tAlloc[i], stations:sAlloc[i],
    founded:relDate(-ri(400,2200)),
    status: chance(.9)?'正常':'筹备中'
  }));
  // 车辆类型拆分：牵引车 1608 / 挂车 1795
  const types = [];
  for(let i=0;i<TOTAL.tractor;i++) types.push('tractor');
  for(let i=0;i<TOTAL.trailer;i++) types.push('trailer');
  for(let i=types.length-1;i>0;i--){ const j=Math.floor(rf()*(i+1)); [types[i],types[j]]=[types[j],types[i]]; }
  let p=0;
  list.forEach(b=>{ b.tractor=0; b.trailerVeh=0; for(let k=0;k<b.vehicles;k++){ if(types[p++]==='tractor') b.tractor++; else b.trailerVeh++; } });
  return list;
})();

/* ---------- 车辆 3403 ---------- */
const MODELS = [
  ['一汽解放 J6P 6×4','tractor',282],['中国重汽 豪沃 TX 6×4','tractor',350],['陕汽德龙 X3000 6×4','tractor',282],
  ['东风柳汽 乘龙 H5 4×2','tractor',200],['福田欧曼 EST 6×4','tractor',282],['徐工汉风 G7 6×4','tractor',282],
  ['中集通华 三轴骨架半挂','trailer',0],['梁山通亚 栏板半挂','trailer',0],['扬州中集 侧帘半挂','trailer',0]
];
const BATTERY_KWH = [282,350,282,280,350,310];

const VEHICLES = (()=>{
  // 租赁状态与线上控制台口径一致：全出租 68 / 半出租 1196 / 非出租 2139
  const rents = [];
  for(let i=0;i<68;i++) rents.push('全出租');
  for(let i=0;i<1196;i++) rents.push('半出租');
  for(let i=0;i<2139;i++) rents.push('非出租');
  for(let i=rents.length-1;i>0;i--){ const j=Math.floor(rf()*(i+1)); [rents[i],rents[j]]=[rents[j],rents[i]]; }
  const out=[];
  let n=1;
  BRANCHES.forEach(b=>{
    for(let i=0;i<b.vehicles;i++){
      const isT = i < b.tractor;
      const model = isT ? pick(MODELS.filter(m=>m[1]==='tractor')) : pick(MODELS.filter(m=>m[1]==='trailer'));
      const letter = 'DFGHJKLM'.split('')[ri(0,7)];
      const plate = b.plate + '·' + letter + (isT ? pad(ri(0,99999),5) : pad(ri(0,9999),4)+'挂');
      const year = ri(2019,2025);
      const soc = isT ? ri(18,99) : null;
      const expiry = ri(-40, 330);
      const ins = ri(-30, 340);
      out.push({
        id:'V'+pad(n++,5),
        plate,
        type: isT?'牵引车':'挂车',
        model: model[0],
        vin: 'LFWSRXNJ' + (isT?'1':'2') + pad(ri(0,99999999),8),
        branchId: b.id, branch: b.name, city:b.city,
        driver: isT ? pick(SURNAME)+pick(GIVEN) : '—',
        batteryId: isT ? ('ND-BP-'+String(year).slice(2)+d2(ri(1,12))+'-'+pad(ri(0,99999),5)) : '—',
        kwh: isT ? pick(BATTERY_KWH) : 0,
        soc: isT ? soc : null,
        soh: isT ? ri(82,100) : null,
        mileage: ri(18000, 560000),
        regDate: relDate(-ri(200,2400)),
        licExpire: relDate(expiry),
        jqExpire: relDate(ins),
        syExpire: relDate(ins+ri(-20,25)),
        rent: rents[n-1],
        status: chance(.84)?'运营中' : (chance(.5)?'空闲':'维修中'),
        online: chance(.86)
      });
    }
  });
  // 类型分布已由 BRANCHES 保证：牵引车 1608 / 挂车 1795
  return out;
})();

/* ---------- 挂厢 2698 ---------- */
const TRAILERS = (()=>{
  // 口径：全出租 21 / 半出租 1252 / 非出租 1425 = 2698
  const rents = [];
  for(let i=0;i<21;i++) rents.push('全出租');
  for(let i=0;i<1252;i++) rents.push('半出租');
  for(let i=0;i<1425;i++) rents.push('非出租');
  for(let i=rents.length-1;i>0;i--){ const j=Math.floor(rf()*(i+1)); [rents[i],rents[j]]=[rents[j],rents[i]]; }
  const out=[]; let n=1;
  BRANCHES.forEach(b=>{
    for(let i=0;i<b.trailers;i++){
      const plate = b.plate + '·' + 'DFGHJ'[ri(0,4)] + pad(ri(0,9999),4) + '挂';
      const rent = rents[n-1];
      out.push({
        id:'GX'+pad(n++,5),
        plate,
        type: pick(['三轴骨架半挂','栏板半挂','侧帘半挂','厢式半挂']),
        branchId:b.id, branch:b.name,
        rent,
        bindPlate: rent==='非出租' ? '—' : (b.plate+'·'+'DFGHJKLM'[ri(0,7)]+pad(ri(0,99999),5)),
        licExpire: relDate(ri(-20,340)),
        inspExpire: relDate(ri(-10,300)),
        insExpire: relDate(ri(-15,320)),
        year: ri(2018,2025),
        status: rent==='非出租' ? '在场待租' : '在途'
      });
    }
  });
  return out;
})();

/* ---------- 司机 4780 ---------- */
const DRIVERS = (()=>{
  const out=[]; let n=1;
  BRANCHES.forEach(b=>{
    for(let i=0;i<b.drivers;i++){
      const name = pick(SURNAME)+pick(GIVEN);
      const lic = relDate(ri(-10,900));
      const q = relDate(ri(-8,760));
      const score = ri(62,100);
      out.push({
        id:'D'+pad(n++,5),
        name, phone:'1'+pick(['3','5','7','8','9'])+pad(ri(0,999999999),9).slice(0,9),
        idcard: '1302' + pad(ri(0,99),2) + '19' + pad(ri(70,99),2) + d2(ri(1,12)) + d2(ri(1,28)) + '****',
        branchId:b.id, branch:b.name,
        plate: chance(.9) ? (b.plate+'·'+'DFGHJKLM'[ri(0,7)]+pad(ri(0,99999),5)) : '—',
        licExpire: lic, qualExpire: q,
        years: ri(2,26), score,
        status: chance(.93)?'在职':(chance(.5)?'请假':'停运'),
        joinDate: relDate(-ri(30,2400)),
        events: ri(0,4)
      });
    }
  });

const withinDays = (dateStrVal, days) => {
  const t = new Date(dateStrVal+'T00:00:00').getTime();
  if(isNaN(t)) return false;
  const diff = (t - BASE.getTime())/DAY;
  return diff >= -3 && diff <= days;
};

/* 生成齿轮轮廓（8 齿），避免手写路径失真 */
const GEAR_PATH = (()=>{
  const cx=12, cy=12, rO=9.7, rI=7.2, N=8, W=Math.PI*2/N;
  const pt = (a,r) => [(cx+Math.cos(a)*r).toFixed(2), (cy+Math.sin(a)*r).toFixed(2)];
  let d = '';
  for(let i=0;i<N;i++){
    const a = i*W;
    const p1=pt(a-W*0.18,rO), p2=pt(a+W*0.18,rO), p3=pt(a+W*0.32,rI), p4=pt(a+W*0.68,rI), p5=pt(a+W*0.82,rO);
    if(i===0) d += 'M'+p1[0]+' '+p1[1];
    d += ' L'+p2[0]+' '+p2[1]+' L'+p3[0]+' '+p3[1]+' L'+p4[0]+' '+p4[1]+' L'+p5[0]+' '+p5[1];
  }
  return d + ' Z';
})();

function icoTech(name, size){

function ico(name, size, cls){
  const raw = ICO_RAW[name] || ICO_RAW.file;
  const s = size || 16;
  return '<svg class="'+(cls||'')+'" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+raw+'</svg>';

/* ---------- 基础工具 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }

function statusPill(text){
  const t = String(text||'');
  let cls = 'p-gray';
  if(/完成|有效|正常|运营中|在职|在途|合作中|全出租|已确认|通过/.test(t)) cls='p-g';
  else if(/待|预警|即将|筹备|半出租|请假|调整/.test(t)) cls='p-o';
  else if(/缺货|停用|停运|逾期|驳回|暂停|异常|离线/.test(t)) cls='p-r';
  else if(/空闲|在场待租|维修中/.test(t)) cls='p-b';
  return '<span class="pill '+cls+'">'+esc(t)+'</span>';
}

/* ---------- Toast ---------- */
function toast(msg, type){
  let box = qs('.toasts');
  if(!box){ box = document.createElement('div'); box.className='toasts'; document.body.appendChild(box); }
  const el = document.createElement('div');
  const icon = type==='err' ? 'alert' : (type==='warn' ? 'alert' : 'check');
  el.className = 'toast ' + (type||'ok');
  el.innerHTML = ico(icon,14) + '<span>'+esc(msg)+'</span>';
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 2600);
}

/* ---------- 抽屉 ---------- */
const DW = { el:null, ov:null, state:null };
function drawer(opts){
  if(!DW.ov){
    DW.ov = document.createElement('div'); DW.ov.className='ov';
    DW.ov.addEventListener('click', closeDrawer);
    DW.el = document.createElement('div'); DW.el.className='drawer';
    document.body.appendChild(DW.ov); document.body.appendChild(DW.el);
  }
  DW.state = { opts, tab: opts.active || (opts.tabs && opts.tabs[0] && opts.tabs[0].k) };
  paintDrawer();
  requestAnimationFrame(()=>{ DW.ov.classList.add('show'); DW.el.classList.add('show'); });
}
function paintDrawer(){
  const {opts, tab} = DW.state;
  const tabs = opts.tabs || [];
  const cur = tabs.find(t=>t.k===tab) || tabs[0];
  DW.el.innerHTML =
    '<div class="dw-hd"><div><h3>'+opts.title+'</h3>'+(opts.sub?'<div class="sub">'+opts.sub+'</div>':'')+'</div>'+
      '<div class="dw-x" data-act="close-drawer">'+ico('x',15)+'</div></div>'+
    (tabs.length>1 ? '<div class="dw-tabs">'+tabs.map(t=>'<div class="dw-tab'+(t.k===tab?' on':'')+'" data-act="dw-tab" data-k="'+t.k+'">'+esc(t.label)+'</div>').join('')+'</div>' : '')+
    '<div class="dw-bd">'+(cur?cur.render():'')+'</div>'+
    (opts.footer ? '<div class="dw-ft">'+opts.footer+'</div>' : '');
}
function closeDrawer(){
  if(!DW.el) return;
  DW.el.classList.remove('show'); DW.ov.classList.remove('show');
  setTimeout(()=>{ if(DW.el && !DW.el.classList.contains('show')){ DW.el.innerHTML=''; } }, 260);
}

/* ---------- 弹窗 ---------- */
const MD = { el:null, ov:null };
function modal(opts){
  if(!MD.ov){
    MD.ov = document.createElement('div'); MD.ov.className='ov'; MD.ov.style.zIndex=88;
    MD.ov.addEventListener('click', closeModal);
    MD.el = document.createElement('div'); MD.el.className='modal';
    document.body.appendChild(MD.ov); document.body.appendChild(MD.el);
  }
  MD.el.innerHTML =
    '<div class="mh">'+esc(opts.title)+'<span class="x" data-act="close-modal">'+ico('x',14)+'</span></div>'+
    '<div class="mb">'+opts.body+'</div>'+
    '<div class="mf">'+(opts.footer || ('<button class="btn" data-act="close-modal">取消</button><button class="btn btn-primary" data-act="modal-ok">确定</button>'))+'</div>';
  MD.onOk = opts.onOk;
  MD.ov.classList.add('show'); MD.el.classList.add('show');
  const first = MD.el.querySelector('input,select,textarea');
  if(first) setTimeout(()=>first.focus(),60);
}
function closeModal(){
  if(!MD.el) return;
  MD.el.classList.remove('show'); MD.ov.classList.remove('show');
}

/* ---------- 表格 ---------- */
function tableHtml(cfg){
  const cols = cfg.cols, rows = cfg.rows || [];
  let head = '<tr>' + cols.map(c=>'<th class="'+(c.cls||'')+'"'+(c.w?' style="width:'+c.w+'"':'')+'>'+c.t+'</th>').join('') + '</tr>';
  let body = '';
  if(!rows.length){
    body = '<tr><td class="empty" colspan="'+cols.length+'">'+ico('search',34)+'<div>'+(cfg.empty||'暂无数据')+'</div></td></tr>';
  } else {
    body = rows.map(r=>{
      const cls = (cfg.rowClass ? cfg.rowClass(r) : '') + (cfg.onRow ? ' clickable' : '');
      const attr = (cfg.onRow ? ' ' + cfg.onRow(r) : '') + (cls.trim() ? ' class="'+cls.trim()+'"' : '');
      return '<tr'+attr+'>' +
        cols.map(c=>'<td class="'+(c.cls||'')+'">'+(c.render? c.render(r) : esc(r[c.k]))+'</td>').join('') + '</tr>';
    }).join('');
  }
  return '<div class="tb-scroll"><table class="tb"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}

function pagerHtml(cfg){
  const total = cfg.total||0, size = cfg.size||15, page = Math.max(1, cfg.page||1);
  const pages = Math.max(1, Math.ceil(total/size));
  const key = cfg.key;
  let nums = [];
  const push = n => nums.push('<div class="pg'+(n===page?' on':'')+'" data-act="pg" data-key="'+key+'" data-p="'+n+'">'+n+'</div>');
  if(pages<=7){ for(let i=1;i<=pages;i++) push(i); }
  else{
    push(1);
    if(page>3) nums.push('<div class="pg dis">…</div>');
    for(let i=Math.max(2,page-1); i<=Math.min(pages-1,page+1); i++) push(i);
    if(page<pages-2) nums.push('<div class="pg dis">…</div>');
    push(pages);
  }
  return '<div class="pager"><span class="cnt">共 <b>'+fmt(total)+'</b> 条 · 第 '+page+' / '+pages+' 页</span>'+
    '<div class="pg '+(page<=1?'dis':'')+'" data-act="pg" data-key="'+key+'" data-p="'+(page-1)+'">上一页</div>'+
    nums.join('')+
    '<div class="pg '+(page>=pages?'dis':'')+'" data-act="pg" data-key="'+key+'" data-p="'+(page+1)+'">下一页</div>'+
    '<span class="sz">每页 <select class="sel" data-act="page-size" data-key="'+key+'">'+[10,15,20,30,50].map(n=>'<option value="'+n+'"'+(n===size?' selected':'')+'>'+n+'</option>').join('')+'</select> 条</span></div>';
}

/* 分页切片 */
function pageSlice(list, st){
  const size = st.size || 15;
  const pages = Math.max(1, Math.ceil(list.length/size));
  if(st.page > pages) st.page = pages;
  const start = (st.page-1)*size;
  return list.slice(start, start+size);
}

/* ---------- 图表（纯 SVG） ---------- */
function lineChart(cfg){
  const w = cfg.w||520, h = cfg.h||170, P = cfg.pad||{l:34,r:12,t:12,b:22};
  const series = cfg.series||[], labels = cfg.labels||[];
  const yMin = cfg.yMin!=null?cfg.yMin:0, yMax = cfg.yMax!=null?cfg.yMax:100;
  const iw = w-P.l-P.r, ih = h-P.t-P.b;
  const X = i => P.l + (series[0].data.length<=1?0:(i/(series[0].data.length-1))*iw);
  const Y = v => P.t + ih - ((v-yMin)/(yMax-yMin))*ih;
  let grid='', ylab='';
  for(let i=0;i<=4;i++){
    const v = yMin + (yMax-yMin)*i/4, y = Y(v);
    grid += '<line x1="'+P.l+'" y1="'+y.toFixed(1)+'" x2="'+(w-P.r)+'" y2="'+y.toFixed(1)+'" stroke="#eaf0f6" stroke-width="1"/>';
    ylab += '<text x="'+(P.l-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="#9aa9ba">'+(cfg.yFmt?cfg.yFmt(v):Math.round(v))+'</text>';
  }
  let xlab='';
  const step = Math.ceil(labels.length/6) || 1;
  labels.forEach((t,i)=>{ if(i%step===0 || i===labels.length-1) xlab += '<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9.5" fill="#9aa9ba">'+esc(t)+'</text>'; });
  let paths='';
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>[X(i),Y(v)]);
    const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      paths += '<path d="'+d+' L '+X(s.data.length-1).toFixed(1)+' '+Y(yMin).toFixed(1)+' L '+X(0).toFixed(1)+' '+Y(yMin).toFixed(1)+' Z" fill="'+s.color+'" opacity=".1"/>';
    }
    paths += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||1.8)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
    if(s.dot!==false && !s.dash){
      const last = pts[pts.length-1];
      paths += '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="#fff" stroke="'+s.color+'" stroke-width="1.8"/>';
    }
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="display:block">'+grid+ylab+xlab+paths+'</svg>'+
    (cfg.legend!==false && series.length>1 ? '<div class="legend" style="margin-top:6px;padding-left:'+P.l+'px">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>' : '');
}

function barChart(cfg){
  const w = cfg.w||520, h = cfg.h||160, P = cfg.pad||{l:32,r:10,t:10,b:22};
  const data = cfg.data||[], labels = cfg.labels||[];
  const iw = w-P.l-P.r, ih = h-P.t-P.b;
  const max = cfg.max || Math.max.apply(null, data.concat([1]));
  const bw = iw/data.length*0.52;
  let grid='';
  for(let i=0;i<=3;i++){
    const y = P.t + ih - ih*i/3;
    grid += '<line x1="'+P.l+'" y1="'+y.toFixed(1)+'" x2="'+(w-P.r)+'" y2="'+y.toFixed(1)+'" stroke="#eaf0f6"/>';
  }
  let bars='';
  data.forEach((v,i)=>{
    const x = P.l + iw*(i+0.5)/data.length - bw/2;
    const bh = Math.max(1, ih*v/max);
    bars += '<rect x="'+x.toFixed(1)+'" y="'+(P.t+ih-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+(cfg.color||'#2f7de1')+'" opacity="'+(cfg.opacity||0.88)+'" rx="1"/>';
    if(labels[i]) bars += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9.5" fill="#9aa9ba">'+esc(labels[i])+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="display:block">'+grid+bars+'</svg>';
}

function ringGauge(pct, cfg){
  cfg = cfg||{};
  const size = cfg.size||118, r = size/2-9, c = 2*Math.PI*r;
  const v = Math.max(0, Math.min(100, pct));
  const color = cfg.color || (v>=60?'#10a37f':(v>=25?'#f59e0b':'#e5484d'));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block">'+

function box(title, body, opts){
  opts = opts||{};
  return '<div class="box '+(opts.cls||'')+'">'+(title?'<div class="box-hd"><span class="t">'+(opts.ico?ico(opts.ico,15):'')+esc(title)+'</span>'+(opts.right?'<span class="r">'+opts.right+'</span>':'')+'</div>':'')+body+'</div>';

function expireCell(d){
  const soon = withinDays(d, 30);
  const over = new Date(d+'T00:00:00') < new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-3);
  return '<span'+(soon||over?' style="color:'+(over?'#d14343':'#b07a0d')+'"':'')+'>'+esc(d)+'</span>'+(over?' <span class="pill p-r">已过期</span>':(soon?' <span class="pill p-o">即将到期</span>':''));
}
function branchSel(val){
  return select('branch', [{v:'',t:'全部分公司'}].concat(BRANCHES.map(b=>({v:b.id,t:b.name}))), val);
}
function seedOf(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return Math.abs(h); }
function srnd(id, salt){ const s = seedOf(id+'#'+(salt||'')); return (s%10000)/10000; }
function sr(id, salt, a, b){ return a + Math.floor(srnd(id,salt)*(b-a+1)); }

/* 电池派生数据 */
function battOf(v){
  if(!v || v.type!=='牵引车') return null;
  const s = seedOf(v.id);
  const cellMax = 3.32 + (s%9)/1000;
  const diff = 8 + (s%70);
  const cellMin = +(cellMax - diff/1000).toFixed(3);
  const tempMax = 26 + (s%16);
  const socSeries = Array.from({length:24},(_,i)=>{
    const base = v.soc + Math.sin((s%7+i)/3.1)*9 - i*0.35;
    return Math.max(6, Math.min(100, Math.round(base)));
  });
  const tempSeries = Array.from({length:24},(_,i)=> tempMax - 6 + Math.round(Math.cos((s%5+i)/2.7)*4));
  const decay = +(0.38 + (s%7)/10).toFixed(2);
  const hist12 = Array.from({length:12},(_,i)=> +(Math.min(100, v.soh + decay*(11-i))).toFixed(1));
  const pred = [3,6,12].map(m=> +(Math.max(60, v.soh - decay*m)).toFixed(1));
  const dTdt = +(0.2 + (s%12)/10).toFixed(1);
  const irJump = +(0.5 + (s%9)/10).toFixed(1);
  const riskScore = (diff>60?2:0) + (tempMax>=42?2:(tempMax>=38?1:0)) + (dTdt>=0.9?1:0) + (irJump>=1.1?1:0);
  const riskLevel = riskScore>=4 ? '高风险' : (riskScore>=2 ? '关注' : '正常');
  const tempField = Array.from({length:24},(_,i)=> tempMax - ((i*7+s)%6));
  return {
    packVolt: 600 + (s%80),
    cellMax: +cellMax.toFixed(3), cellMin, diff,
    tempMax, tempMin: tempMax - 5 - (s%4),
    insulation: 1200 + (s%2400),
    cycles: 180 + (s%1400),
    soh: v.soh,
    socSeries, tempSeries,
    decay, hist12, pred, dTdt, irJump, riskScore, riskLevel, tempField,
    ir: +(0.62 + (s%40)/100).toFixed(2),
    capKeep: +(v.soh - 0.6).toFixed(1),
    retire: Math.max(6, Math.round((v.soh - 70) / decay))
  };
}

function pathLen(coords){
  let L=0, segs=[];
  for(let i=1;i<coords.length;i++){
    const a=coords[i-1], b=coords[i];
    const d=Math.hypot(b[0]-a[0],b[1]-a[1]); segs.push(d); L+=d;
  }
  return {L,segs};
}
function pointOn(coords, t){
  const {L,segs} = pathLen(coords);
  let target = Math.max(0,Math.min(1,t))*L;
  for(let i=0;i<segs.length;i++){
    if(target <= segs[i] || i===segs.length-1){
      const a=coords[i], b=coords[i+1];
      const r = segs[i]? target/segs[i] : 0;
      return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r];
    }
    target -= segs[i];
  }
  return coords[coords.length-1];
}

    const coords = corr.map(c=>CITIES[c]);

      v, coords, t,
      x:+p[0].toFixed(1), y:+p[1].toFixed(1),
      speed: 32 + (i*7)%58,
      soc: v.soc,
      alarm: i%11===3,

    '</div>'+
    '<div class="main"><div class="page" id="view"></div></div>';
}

function parseHash(){
  const raw = (location.hash||'').replace(/^#\/?/,'');
  const [name, qs] = raw.split('?');
  const key = PAGES[name] ? name : 'dashboard';
  const params = {};
  (qs||'').split('&').filter(Boolean).forEach(p=>{
    const i = p.indexOf('=');
    const k = i<0 ? p : p.slice(0,i);
    const v = i<0 ? '' : decodeURIComponent(p.slice(i+1));
    params[k] = v;
  });
  return {name:key, params};
}

function ensureState(name, params){
  const pk = JSON.stringify(params);
  if(LAST.name!==name || LAST.pk!==pk){
    PS[name] = {page:1, size:(PS[name]&&PS[name].size)||15, q:'', f:{}};
    Object.assign(PS[name].f, params);
    if(name==='livemap'){ MAPSTATE.pop = null; }
    if(name==='company' && !params.tab) PS[name].f.tab='info';
    LAST = {name, pk};
  }
  return PS[name];
}

function render(){
  const {name, params} = parseHash();
  const st = ensureState(name, params);
  const page = PAGES[name];
  CUR = name;
  const af = document.activeElement;
  const fk = af && af.dataset ? af.dataset.focus : null;
  const view = document.getElementById('view');
  if(!view) return;
  view.innerHTML = page.render(st);
  // 侧栏选中态
  Array.from(document.querySelectorAll('.nav-item')).forEach(n=>{
    const k = (n.getAttribute('data-go')||'').replace('#/','');
    n.classList.toggle('on', k===name);
  });
  document.title = page.title + ' · iService 车队管理平台';
  if(fk){
    const el = document.querySelector('[data-focus="'+fk+'"]');
    if(el){ el.focus(); if(el.setSelectionRange && el.tagName==='INPUT'){ const l=el.value.length; try{ el.setSelectionRange(l,l); }catch(e){} } }
  }
}

/* ---------- 重放 ---------- */
function applyPlayPos(p){
  const live = LIVE.find(l=>l.v.id===MAPSTATE.sel);
  if(!live) return;
  const pt = pointOn(live.coords, p);
  const g = document.querySelector('.play-marker');
  if(g){ g.setAttribute('transform','translate('+pt[0].toFixed(1)+','+pt[1].toFixed(1)+')'); g.style.opacity = 1; }
  const tm = document.querySelector('.replay .tm');
  if(tm) tm.textContent = live.v.plate + ' · ' + (p*100).toFixed(0) + '%';
  const input = document.querySelector('[data-act="map-seek"]');
  if(input && Math.abs(+input.value - p*100) > 1) input.value = p*100;
}
function toggleReplay(){
  if(MAPSTATE.play){ stopReplay(); return; }
  const live = LIVE.find(l=>l.v.id===MAPSTATE.sel);
  if(!live) return;
  MAPSTATE.play = {id:live.v.id, t:0, raf:null, paused:false};
  render();
  const t0 = performance.now(), dur = 16000;
  const step = (now)=>{
    if(!MAPSTATE.play) return;
    if(MAPSTATE.play.paused){ MAPSTATE.play.raf = requestAnimationFrame(step); MAPSTATE.play.t0 = (now - MAPSTATE.play.t*dur); return; }
    const p = Math.min(1, (now - (MAPSTATE.play.t0||t0))/dur);
    MAPSTATE.play.t = p;
    applyPlayPos(p);
    if(p < 1) MAPSTATE.play.raf = requestAnimationFrame(step);
    else { MAPSTATE.play = null; render(); toast('轨迹回放结束'); }
  };
  MAPSTATE.play.t0 = t0;
  MAPSTATE.play.raf = requestAnimationFrame(step);
}
function stopReplay(){
  if(MAPSTATE.play && MAPSTATE.play.raf) cancelAnimationFrame(MAPSTATE.play.raf);
  MAPSTATE.play = null;
  render();
}

/* ---------- 动作表 ---------- */
const ACT = {
  'toast': d => toast(d.msg || '操作成功'),
  'close-drawer': () => closeDrawer(),
  'close-modal': () => closeModal(),
  'modal-ok': () => { const fn = MD.onOk; closeModal(); if(fn) fn(); },
  'dw-tab': d => { DW.state.tab = d.k; paintDrawer(); },
  'pg': d => { PS[CUR].page = Math.max(1, +d.p); render(); },
  'refresh-dash': () => { render(); toast('数据已刷新'); },
  'new-version': () => toast('新版体验环境正在灰度中，暂未开放', 'warn'),
  'user-menu': () => toast('当前账号：'+BRAND.user+'（'+BRAND.role+'）'),
  'logout': () => toast('演示环境不支持退出登录', 'warn'),
  'tenant': () => toast('当前企业：'+BRAND.tenant),
  'print': () => window.print(),

  /* 挂厢 */
  'open-trailer': d => drawerTrailer(d.id),
  'trailer-return': d => {
    const t = TRAILERS.find(x=>x.id===d.id); if(!t) return;
    modal({
      title:'办理退租',
      body:'<div class="fr"><label>挂厢</label><div style="font-size:13px"><b>'+esc(t.plate)+'</b> <span class="mut">'+esc(t.id)+'</span></div></div>'+
        '<div class="fr"><label>退租日期</label><input class="inp" type="date" value="'+relDate(1)+'"></div>'+
        '<div class="fr"><label>原因</label><select class="sel"><option>客户合同到期</option><option>车辆调拨</option><option>挂厢维修</option></select></div>'+
        '<div style="font-size:12px;color:#8493a6;margin-top:6px">退租后挂厢状态变更为「在场待租」，并同步释放绑定车头。</div>',
      onOk:()=>{ t.rent='非出租'; t.status='在场待租'; t.bindPlate='—'; closeDrawer(); render(); toast('挂厢 '+t.plate+' 已办理退租'); }
    });
  },
  'trailer-lease': d => {
    const t = TRAILERS.find(x=>x.id===d.id); if(!t) return;
    modal({
      title:'挂厢出租',
      body:'<div class="fr"><label>挂厢</label><div style="font-size:13px"><b>'+esc(t.plate)+'</b></div></div>'+
        '<div class="fr"><label>租赁方式</label><select class="sel" data-k="rent"><option>全出租</option><option>半出租</option></select></div>'+
        '<div class="fr"><label>绑定车头</label><input class="inp" data-k="plate" placeholder="输入车头车牌" value="'+esc(t.branch.slice(0,2))+'·D00001"></div>',
      onOk:(el)=>{ const sel=el.querySelector('[data-k="rent"]'), pl=el.querySelector('[data-k="plate"]');
        t.rent=sel.value; t.bindPlate=pl.value||'—'; t.status='在途'; closeDrawer(); render(); toast('挂厢已登记出租'); }
    });
  },
  'trailer-add': () => {
    modal({title:'新增挂厢',
      body:'<div class="fr"><label>挂厢车牌</label><input class="inp" placeholder="如 冀B·D1234挂"></div>'+
        '<div class="fr"><label>挂厢类型</label><select class="sel"><option>三轴骨架半挂</option><option>栏板半挂</option><option>侧帘半挂</option><option>厢式半挂</option></select></div>'+
        '<div class="fr"><label>所属分公司</label><select class="sel">'+BRANCHES.map(b=>'<option>'+b.name+'</option>').join('')+'</select></div>'+
        '<div class="fr"><label>购置年份</label><input class="inp" type="number" value="2025"></div>',
      onOk:()=>{ toast('挂厢已提交入库审核'); }});
  },

  /* 配件 */
  'open-part': d => drawerPart(d.id),
  'part-in': d => partMove(d.id, 'in'),
  'part-out': d => partMove(d.id, 'out'),

  /* 车辆 */
  'open-vehicle': d => drawerVehicle(d.id),
  'veh-add': () => {
    modal({title:'新增车辆',
      body:'<div class="fr"><label>车牌号</label><input class="inp" placeholder="如 冀B·D88888"></div>'+
        '<div class="fr"><label>车辆类型</label><select class="sel"><option>牵引车</option><option>挂车</option></select></div>'+
        '<div class="fr"><label>所属分公司</label><select class="sel">'+BRANCHES.map(b=>'<option>'+b.name+'</option>').join('')+'</select></div>'+
        '<div class="fr"><label>电池包编号</label><input class="inp" placeholder="ND-BP-..."></div>',
      onOk:()=>toast('车辆已提交，等待证照审核')});
  },
  'clear-expire': () => { delete PS[CUR].f.expire; render(); },

  /* 公司 */
  'company-tab': d => { PS.company.f.tab = d.k; PS.company.f.apply=''; PS.company.page=1; render(); },
  'open-station': d => drawerStation(d.id),

  /* 司机 / 线路 / 分公司 */
  'open-driver': d => drawerDriver(d.id),
  'open-route': d => drawerRoute(d.id),
  'open-branch': d => drawerBranch(d.id),

  /* 地图 */
  'map-pick': d => {
    if(MAPSTATE.play && MAPSTATE.play.raf) cancelAnimationFrame(MAPSTATE.play.raf);
    MAPSTATE.play = null;
    MAPSTATE.sel = d.id; MAPSTATE.pop = d.id; render();
  },
  'map-layer': d => { MAPSTATE.layers[d.k] = !MAPSTATE.layers[d.k]; render(); },
  'map-play': () => toggleReplay(),

  /* 工单 */
  'ticket-tab': d => { PS.tickets.f.status = d.k; PS.tickets.page=1; render(); },
  'open-ticket': d => drawerTicket(d.id),
  'ticket-ok': d => {
    const t = TICKETS.find(x=>x.id===d.id); if(!t) return;
    if(t.status==='待首次确认'){ t.status='待二次确认'; toast('已通过首次确认，等待二次确认'); }
    else if(t.status==='待二次确认'){ t.status='已完成'; toast('二次确认完成，工单进入结算'); }
    else return;
    closeDrawer(); render();
  },
  'ticket-reject': d => {
    const t = TICKETS.find(x=>x.id===d.id); if(!t) return;
    modal({title:'驳回工单', body:'<div class="fr"><label>驳回原因</label><input class="inp" value="维修项目与报价不符"></div>'+
      '<div style="font-size:12px;color:#8493a6">驳回后服务站可修改并重新提交，不影响其信用分。</div>',
      onOk:()=>{ t.status='已完成'; closeDrawer(); render(); toast('工单已驳回','warn'); }});
  },

  /* 作业指导书 */
  'sop-stage': d => { PS.sop.f.stage = d.k; render(); },

  /* 导出 */
  'export-csv': d => exportCsv(d.kind)
};

function partMove(id, dir){
  const p = PARTS.find(x=>x.id===id); if(!p) return;
  modal({
    title:(dir==='in'?'配件入库':'配件出库')+' · '+p.name,
    body:'<div class="fr"><label>配件编码</label><div style="font-size:12.5px">'+esc(p.code)+' <span class="mut">'+esc(p.spec)+'</span></div></div>'+
      '<div class="fr"><label>当前库存</label><div style="font-size:13px"><b>'+p.stock+'</b> '+p.unit+'</div></div>'+
      '<div class="fr"><label>数量</label><div class="stepper"><button data-step="-1">−</button><input data-k="qty" type="number" value="10" min="1"><button data-step="1">＋</button></div></div>'+
      '<div class="fr"><label>仓库</label><select class="sel">'+WAREHOUSES.map(w=>'<option'+(w===p.wh?' selected':'')+'>'+w+'</option>').join('')+'</select></div>'+
      '<div class="fr"><label>经办人</label><input class="inp" value="'+BRAND.user+'"></div>',
    onOk:(el)=>{
      const q = Math.max(1, parseInt((el.querySelector('[data-k="qty"]')||{}).value||'1',10));
      if(dir==='in'){ p.stock += q; p.monthOut = p.monthOut; toast('入库 '+q+' '+p.unit+'，当前库存 '+p.stock); }
      else {
        if(q > p.stock){ toast('出库数量超出现有库存','err'); return; }
        p.stock -= q; toast('出库 '+q+' '+p.unit+'，剩余 '+p.stock);
      }
      p.status = p.stock===0 ? '缺货' : (p.stock < p.safe ? '预警' : '正常');
      closeDrawer(); render();
    }
  });
}

/* ---------- CSV 导出 ---------- */
function exportCsv(kind){
  let head=[], rows=[];
  if(kind==='trailers'){ head=['挂厢编号','车牌号','类型','分公司','租赁状态','绑定车头','保险到期','年审到期'];
    rows=TRAILERS.map(t=>[t.id,t.plate,t.type,t.branch,t.rent,t.bindPlate,t.insExpire,t.inspExpire]); }
  if(kind==='parts'){ head=['编码','名称','规格','品牌','仓库','库存','安全库存','单价','状态'];
    rows=PARTS.map(p=>[p.code,p.name,p.spec,p.brand,p.wh,p.stock,p.safe,p.price,p.status]); }
  if(kind==='vehicles'){ head=['车牌号','类型','车型','分公司','司机','电池包','SOC','状态'];
    rows=VEHICLES.slice(0,500).map(v=>[v.plate,v.type,v.model,v.branch,v.driver,v.batteryId,v.soc==null?'':v.soc,v.status]); }
  if(kind==='drivers'){ head=['姓名','手机号','分公司','绑定车辆','驾驶证到期','资格证到期','安全评分'];
    rows=DRIVERS.slice(0,500).map(d=>[d.name,d.phone,d.branch,d.plate,d.licExpire,d.qualExpire,d.score]); }
  if(kind==='branches'){ head=['分公司','负责人','电话','车辆','挂厢','司机','服务站'];
    rows=BRANCHES.map(b=>[b.name,b.leader,b.phone,b.vehicles,b.trailers,b.drivers,b.stations]); }
  if(kind==='tickets'){ head=['工单号','类型','车牌','服务站','提交时间','金额','状态'];
    rows=TICKETS.slice(0,800).map(t=>[t.id,t.type,t.plate,t.station,t.submit,t.amount,t.status]); }
  if(!head.length) return;
  const csv = '\uFEFF' + [head].concat(rows).map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'iService_'+kind+'_'+relDate(0)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('已导出 CSV 文件');
}

/* ---------- 事件 ---------- */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if(t && !t.matches('select,input')){
    const fn = ACT[t.dataset.act];
    if(fn){ e.preventDefault(); fn(t.dataset, t); return; }
  }
  const go = e.target.closest('[data-go]');
  if(go){ e.preventDefault(); location.hash = go.dataset.go; }
}, false);

/* stepper 按钮 */
document.addEventListener('click', function(e){
  const b = e.target.closest('[data-step]');
  if(!b) return;
  const input = b.parentNode.querySelector('input');
  const step = +b.dataset.step;
  input.value = Math.max(1, (parseInt(input.value,10)||0) + step);
});

let INP_T = null;
document.addEventListener('input', function(e){
  const el = e.target;
  if(el.dataset && el.dataset.act==='map-seek'){ applyPlayPos((+el.value)/100); return; }
  if(el.tagName==='SELECT' || !el.dataset || !el.dataset.f) return;
  const key = el.dataset.f, val = el.value;
  clearTimeout(INP_T);
  INP_T = setTimeout(()=>{
    const st = PS[CUR];
    if(key==='q') st.q = val; else st.f[key] = val;
    st.page = 1;
    render();
  }, 240);
});
document.addEventListener('change', function(e){
  const el = e.target;
  if(el.dataset && el.dataset.act==='page-size'){
    const k = el.dataset.key;
    PS[k].size = +el.value; PS[k].page = 1; render(); return;
  }
  if(el.tagName!=='SELECT' || !el.dataset || !el.dataset.f) return;
  const key = el.dataset.f, val = el.value;
  const st = PS[CUR];
  if(key==='q') st.q = val; else st.f[key] = val;
  st.page = 1;
  render();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal(); closeDrawer(); }
});

/* ---------- 启动 ---------- */
shell();
if(!location.hash) location.hash = '#/dashboard';
window.addEventListener('hashchange', ()=>{ render(); });
render();

</script>
