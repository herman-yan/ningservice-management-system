function exportCSV(type) {
  let headers, rows;
  if(type === 'warranty') {
    headers = ['编号','登记日期','客户名称','联系人','车辆信息','故障描述','维修类型','工单类型','状态','责任工程师','开工时间','完工日期','GSS工单号','是否申领物料','报单员','GSS总费用','总费用','备注'];
    rows = APP.warrantyOrders.map(o => [o.id,o.registerDate,o.customerName,o.contact,o.vehicleInfo,o.faultDesc,o.repairType,o.orderType,o.status,o.engineer,o.startDate,o.completeDate,o.gssOrderNo,o.needMaterial==='1'?'是':'否',o.reporter,o.gssFee,o.totalFee,o.platformNote]);
  } else if(type === 'nonwarranty') {
    headers = ['编号','城市','车牌号','签约客户','产品类型','项目类型','维修状态','维修工程师','报价总金额','已回款','未回款','毛利润','毛利率','付款状态','备注'];
    rows = APP.nonWarrantyOrders.map(o => [o.id||o.seq||o.orderNo,o.city,o.plateNumber,o.signedCustomer,o.productType,o.projectType,o.status,o.repairEngineer,o.quoteTotal,o.receivedAmount,o.unreceivedAmount,o.grossProfit,o.grossMargin,o.paymentStatus,o.remark]);
  } else {
    headers = ['登记编号','关联工单','类型','物料','数量','申领日期','领用日期','旧件接收','旧件返厂','备注'];
    rows = APP.warehouseLogs.map(l => [l.id,l.relatedOrder,l.type,l.material,l.quantity,l.applyDate,l.receiveDate,l.oldPartReceive,l.oldPartReturn,l.note]);
  }
  const bom = '\uFEFF';
  const csv = bom + [headers.join(','), ...rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${type}_${todayStr()}.csv`;
  a.click();
}

function importJSON(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if(confirm('导入将覆盖当前所有数据，确认继续？')) {
        APP = { ...getDefaultData(), ...data };

    } catch(err) {
      alert('文件格式错误，请选择有效的JSON文件');
    }
  };
  reader.readAsText(file);
}

function todayStr() {

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weekStartStr() {
  const d = new Date();
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function monthStartStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function isInPeriod(dateStr, period) {
  if (!dateStr || !period) return true;
  if (period === 'today') return dateStr === todayStr();
  if (period === 'week') return dateStr >= weekStartStr() && dateStr <= todayStr();
  if (period === 'month') return dateStr >= monthStartStr() && dateStr <= todayStr();
  return true;
}

// ===== 健壮的保内/保外识别 =====
// 归一化表头：去空格 + 转小写（兼容「保 外」「状态 」等变体）
function normHeader(h) {
  return String(h == null ? '' : h).trim().replace(/\s+/g, '').toLowerCase();
}
// 保内 / 保外 特征列（模糊匹配，包含即可，兼容同义词/错字）
const WN_SIG = ['编号','登记日期','维修类型','完成状态','责任工程师','gss工单号','工程师产值','中台备注','旧件返厂','申领物料','工单提交时间','建单日期','gss总费用','派工'];
const NW_SIG = ['签约客户名称','报价单','分润','车牌号','车架号','维修状态','业务对接人','物流往返','宁德','实际业务毛利润','barcode号','产品pn','工单号','序号','城市'];
// 状态枚举（行级兜底判定）：只用于导入行的保内/保外判别，两套刻意互不重叠；
// 流转模板的全量状态请看 AFG.WN_FLOW/NW_FLOW.states
const WN_STATUS = ['未派工','已接单','在修','已竣工','已报单','已结清','已终止'];
const NW_STATUS = ['待客户确认','维修完成','关闭工单'];

function detectSheetType(headers) {
  let wn = 0, nw = 0;
  headers.map(normHeader).forEach(h => {
    if (WN_SIG.some(k => h.includes(normHeader(k)))) wn++;
    if (NW_SIG.some(k => h.includes(normHeader(k)))) nw++;
  });
  if (wn >= 2 && wn >= nw) return 'warranty';
  if (nw >= 2 && nw > wn) return 'nonwarranty';
  if (wn > 0 && nw === 0) return 'warranty';
  if (nw > 0 && wn === 0) return 'nonwarranty';
  return null;
}

// 寻找「类型」列（混合表：同一张表既有保内又有保外，用该列逐行判定）
function findTypeCol(headers) {
  for (const h of headers) {
    const n = normHeader(h);
    if (n.includes('类型') || n.includes('保修') || n.includes('保单') || n === '内外' || n.includes('保内保外')) return h;
  }
  return null;
}

// 从行内「状态」列取值（用于行级兜底）
function statusValue(row, headers) {
  for (const h of headers) {
    if (normHeader(h).includes('状态')) {
      const v = String(row[h] == null ? '' : row[h]).trim();
      if (v) return v;
    }
  }
  return '';
}

// 计算某行映射到某套字段后「非默认值」的填充数，用于保内/保外倾向打分
function fillCount(mapped, defs) {
  let c = 0;
  for (const k in defs) {
    const v = mapped[k];
    if (v !== undefined && v !== '' && v !== defs[k]) c++;
  }
  return c;
}

// 单行判定：优先类型列 → 再状态枚举 → 再填充打分
function classifyRow(row, typeCol, headers) {
  if (typeCol) {
    const v = String(row[typeCol] == null ? '' : row[typeCol]).replace(/\s+/g, '');
    if (/保内/.test(v) && !/保外/.test(v)) return 'warranty';
    if (/保外/.test(v) && !/保内/.test(v)) return 'nonwarranty';
  }
  const sv = statusValue(row, headers);
  if (WN_STATUS.includes(sv)) return 'warranty';
  if (NW_STATUS.includes(sv)) return 'nonwarranty';
  const wn = fillCount(mapRow(row, WN_COLUMN_MAP, WN_DEFAULTS), WN_DEFAULTS);
  const nw = fillCount(mapRow(row, NW_COLUMN_MAP, NW_DEFAULTS), NW_DEFAULTS);
  if (wn === 0 && nw === 0) return null;
  return wn >= nw ? 'warranty' : 'nonwarranty';
}

// 整表分类：返回 {wn:[...], nw:[...]}（已按行分好类）
// 判定顺序：类型列 → 整表表头特征 → 逐行兜底。
// 关键：整表表头特征在「一张表内保内保外混排」时不可靠（表头同时命中两侧特征会平票判给保内），
// 因此整表判定前先探测：若表内存在「只能判给另一侧」的行，则放弃整表结论、改为逐行判定，
// 避免混排表把保外行整批误并入保内。
function classifySheetRows(rows) {
  const headers = Object.keys(rows[0] || {});
  const sheetType = detectSheetType(headers);
  const typeCol = findTypeCol(headers);

  // 无类型列且整表有倾向时，先验证该倾向是否会把「明确属于另一侧」的行吞掉
  let useSheetType = !!sheetType;
  if (!typeCol && sheetType) {
    const other = sheetType === 'warranty' ? 'nonwarranty' : 'warranty';
    const conflict = rows.some(r => classifyRow(r, null, headers) === other);
    if (conflict) useSheetType = false;   // 存在反向行 → 整表结论不可靠，转逐行
  }

  const wn = [], nw = [], other = [];
  rows.forEach(r => {
    const t = typeCol ? classifyRow(r, typeCol, headers)
      : (useSheetType ? sheetType : classifyRow(r, null, headers));
    if (t === 'warranty') wn.push(r);
    else if (t === 'nonwarranty') nw.push(r);
    else other.push(r);   // 判定不了的行不丢弃，进未分类池等人工归类
  });
  return { wn, nw, other };
}

function mapRow(rawRow, columnMap, defaults) {
  const obj = {...defaults};
  for (const [cnHeader, jsKey] of Object.entries(columnMap)) {
    if (rawRow[cnHeader] === undefined || rawRow[cnHeader] === null) continue;
    let val = rawRow[cnHeader];
    if (val instanceof Date) {
      const y = val.getFullYear();
      const m = String(val.getMonth()+1).padStart(2,'0');
      const d = String(val.getDate()).padStart(2,'0');
      val = `${y}-${m}-${d}`;
    } else {
      val = String(val).trim();
      if (val === '') continue;   // 空单元格保留默认值，避免覆盖 0 / 0.0 等
    }
    obj[jsKey] = val;
  }
  return obj;
}

// ===== 导入核心（单一事实源）=====
// 解析一份 Excel，按行自动判定保内/保外并合并进台账。
// 返回结构化结果，供工单页与数据看板复用同一套口径，避免两处逻辑漂移。
function afIngestWorkbook(arrayBuffer) {
  const workbook = XLSX.read(new Uint8Array(arrayBuffer), {type:'array', cellDates:true});

  let totalWn = 0, totalNw = 0, totalOther = 0, skipped = 0;
  const newWnData = [], newNwData = [], newOtherData = [];
  const sheetStats = [];
  // 未分类行：把两侧列头都试着映射一遍，保留原始状态供人工归类时参考
  const U_MAP = Object.assign({}, WN_COLUMN_MAP, NW_COLUMN_MAP);
  const U_DEFAULTS = Object.assign({}, WN_DEFAULTS, NW_DEFAULTS, { id: '', status: '待归类', statusRaw: '', category: '未分类' });
  // 批量编号：一次递增计数器，避免逐行写盘（大表导入更快）
  const nextId = (prefix) => {
    APP.idCounters[prefix]++;
    return (prefix === 'wn' ? 'WN-' : 'NW-') + String(APP.idCounters[prefix]).padStart(6, '0');
  };

  for (const sheetName of workbook.SheetNames) {
    const sheet = workbook.Sheets[sheetName];
    const jsonData = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if (!jsonData.length) continue;

    // 逐行分类（兼容整表保内/保外、单表混合、列头变体）
    const { wn, nw, other } = classifySheetRows(jsonData);

    wn.forEach(row => {
      const mapped = mapRow(row, WN_COLUMN_MAP, WN_DEFAULTS);
      if (!mapped.id) mapped.id = nextId('wn');
      afAssignIncomingStatus('WN', mapped, mapped.status);
      newWnData.push(mapped);
      totalWn++;
    });
    nw.forEach(row => {
      const mapped = mapRow(row, NW_COLUMN_MAP, NW_DEFAULTS);
      if (!mapped.seq) mapped.seq = String(newNwData.length + 1);
      if (!mapped.id) mapped.id = nextId('nw');   // 与保内对齐：保外同样需要内部编号
      afAssignIncomingStatus('NW', mapped, mapped.status);
      newNwData.push(mapped);
      totalNw++;
    });
    other.forEach(row => {
      const mapped = mapRow(row, U_MAP, U_DEFAULTS);
      const rawStatus = String(mapped.status || '').trim();
      if (!mapped.customerName && !mapped.signedCustomer && !mapped.vehicleInfo &&
          !mapped.plateNumber && !mapped.faultDesc) { skipped++; return; }
      APP.idCounters.u = (APP.idCounters.u || 0) + 1;
      mapped.sourceId = mapped.id || '';
      mapped.id = 'U-' + String(APP.idCounters.u).padStart(6, '0');
      mapped.statusRaw = rawStatus;
      mapped.status = '待归类';
      mapped.category = '未分类';
      newOtherData.push(mapped);
      totalOther++;
    });
    sheetStats.push({ sheet: sheetName, wn: wn.length, nw: nw.length, other: other.length, total: jsonData.length });
  }

  return { totalWn, totalNw, totalOther, skipped, newWnData, newNwData, newOtherData, sheetStats };
}

// 合并入台账 + 生成结果对象（不触碰界面）
function afCommitImport(ing) {
  const wnRes = ing.totalWn > 0 ? afMergeInto(APP.warrantyOrders, ing.newWnData, AFG.wnMatchKey) : null;
  if (wnRes) APP.warrantyOrders = wnRes.merged.concat(wnRes.added);
  const nwRes = ing.totalNw > 0 ? afMergeInto(APP.nonWarrantyOrders, ing.newNwData, AFG.nwMatchKey) : null;
  if (nwRes) APP.nonWarrantyOrders = nwRes.merged.concat(nwRes.added);
  APP.unclassifiedOrders = APP.unclassifiedOrders || [];
  const uRes = ing.totalOther > 0 ? afMergeInto(APP.unclassifiedOrders, ing.newOtherData, o => o.id) : null;
  if (uRes) APP.unclassifiedOrders = uRes.merged.concat(uRes.added);
  saveData(APP);   // 编号计数器与台账一次写入
  return {
    wn: wnRes ? { added: wnRes.added.length, updated: wnRes.updated.length, unchanged: wnRes.unchanged.length, summary: wnRes.summary } : null,
    nw: nwRes ? { added: nwRes.added.length, updated: nwRes.updated.length, unchanged: nwRes.unchanged.length, summary: nwRes.summary } : null,
    other: uRes ? { added: uRes.added.length, updated: uRes.updated.length, unchanged: uRes.unchanged.length, summary: uRes.summary } : null,
    skipped: ing.skipped
  };
}

// 工单页的导入入口（保内/保外列表页的按钮仍走这里）
function handleExcelUpload(input) {
  const file = input.files[0];
  if (!file) return;

  showUploadStatus('⏳ 正在读取 <b>' + file.name + '</b> 并自动识别保内/保外/未分类 ...', 'info');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const ing = afIngestWorkbook(e.target.result);

      if (ing.totalWn === 0 && ing.totalNw === 0 && ing.totalOther === 0) {
        showUploadStatus('⚠️ 表格没有可用数据行：请先点「📄 下载模板」对照列头，或检查客户/车辆/故障描述是否为空。', 'error');
        input.value = '';
        return;
      }

      const r = afCommitImport(ing);
      renderPage();

      let msg = '✅ 导入完成（已按匹配键去重合并）：';
      const parts = [];
      if (r.wn) parts.push('保内 ' + r.wn.summary);
      if (r.nw) parts.push('保外 ' + r.nw.summary);
      if (r.other) parts.push('未分类 ' + r.other.summary);
      msg += parts.join(' · ') + ' — 来自 <b>' + afEsc(file.name) + '</b>';
      if (r.skipped > 0) msg += ' <span style="opacity:.8">（' + r.skipped + ' 行无法识别已跳过）</span>';
      showUploadStatus(msg, 'success');

    } catch(err) {
      console.error(err);
      showUploadStatus('❌ 解析失败：' + err.message, 'error');
    }
  };
  reader.onerror = function() {
    showUploadStatus('❌ 文件读取失败', 'error');
  };
  reader.readAsArrayBuffer(file);
  input.value = '';
}

// ===== 数据看板：统一导入入口 =====
// 最近一次导入结果，渲染看板时展示（切页后仍可回看，刷新即清）
let afLastImport = null;

function importFromDashboard(input) {
  const file = input.files[0];
  if (!file) return;

  showUploadStatus('⏳ 正在读取 <b>' + afEsc(file.name) + '</b> 并自动分配保内/保外/未分类 ...', 'info');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const ing = afIngestWorkbook(e.target.result);

      if (ing.totalWn === 0 && ing.totalNw === 0 && ing.totalOther === 0) {
        showUploadStatus('⚠️ 表格没有可用数据行：请确认客户/车辆/故障描述有内容，或含「类型」列标注保内/保外。', 'error');
        input.value = '';
        return;
      }

      const r = afCommitImport(ing);
      afLastImport = { file: file.name, time: todayStr(), res: r, sheets: ing.sheetStats };
      renderPage();

      const parts = [];
      if (r.wn) parts.push('保内 ' + r.wn.summary);
      if (r.nw) parts.push('保外 ' + r.nw.summary);
      if (r.other) parts.push('未分类 ' + r.other.summary);
      let msg = '✅ 已自动分配并入库：' + parts.join(' · ');
      if (r.skipped > 0) msg += ' <span style="opacity:.8">（' + r.skipped + ' 行无法识别已跳过）</span>';
      showUploadStatus(msg, 'success');

    } catch(err) {
      console.error(err);
      showUploadStatus('❌ 解析失败：' + err.message, 'error');
    }
  };
  reader.onerror = function() {
    showUploadStatus('❌ 文件读取失败', 'error');
  };
  reader.readAsArrayBuffer(file);
  input.value = '';
}

// 生成并下载「保内 + 保外」导入模板（用 SheetJS 在浏览器端生成，无需联网）
function downloadTemplate() {
  try {
    const wnHeaders = Object.keys(WN_COLUMN_MAP);
    const nwHeaders = Object.keys(NW_COLUMN_MAP);
    const wnSample = wnHeaders.map((h, i) =>
      i === 0 ? 'WN-001' : i === 1 ? '2026-01-01' : i === 2 ? '示例客户A' : (i === 3 ? '张三' : (i === 7 ? '未派工' : (i === 8 ? '李工' : ''))));
    const nwSample = nwHeaders.map((h, i) =>
      i === 0 ? '1' : i === 1 ? '北京' : i === 2 ? 'BX-001' : (i === 3 ? '沪A12345' : (i === 14 ? '待客户确认' : '')));
    const wsWn = XLSX.utils.aoa_to_sheet([wnHeaders, wnSample]);
    const wsNw = XLSX.utils.aoa_to_sheet([nwHeaders, nwSample]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsWn, '保内工单');
    XLSX.utils.book_append_sheet(wb, wsNw, '保外工单');
    XLSX.writeFile(wb, '工单导入模板_保内保外.xlsx');
    showUploadStatus('📄 已生成导入模板，请按模板整理后再次上传。', 'info');
  } catch (err) {
    console.error(err);
    showUploadStatus('❌ 模板生成失败：' + err.message, 'error');
  }
}

// ===== INIT =====
async function initApp() {
  // 是否需要从站点拉取（首次 / 版本过期 / 用户手动清空）
  let hasData = false;
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d && d.dataVersion === DATA_VERSION &&
        ((d.warrantyOrders || []).length > 0 || (d.nonWarrantyOrders || []).length > 0 || (d.unclassifiedOrders || []).length > 0)) {
      hasData = true;
    } else if (d && (d.warrantyOrders || []).length) {
      DATA_STALE = true; // 有旧账但版本不同 -> 强制刷新
    }
  } catch(e) {}

  // 先用当前数据同步渲染一次，保证首屏立即可见（也兼容无 fetch 的轻量环境）
  renderIdentityBar();
  afApplyNavPermission();
  renderPage();
  syncAtDirectoryOnBoot();

  if (!hasData || DATA_STALE) {
    const base = 'https://herman-yan.github.io/ningservice-management-system/work-order/';
    try {
      const [wnResp, nwResp, uResp] = await Promise.all([
        fetch(base + 'data_wn.json'),
        fetch(base + 'data_nw.json'),
        fetch(base + 'data_u.json')
      ]);
      if (wnResp.ok && nwResp.ok) {
        const wnData = await wnResp.json();
        const nwData = await nwResp.json();
        let uData = [];
        if (uResp.ok) { try { uData = await uResp.json(); } catch (e) { uData = []; } }

        // 版本刷新时整体替换三本台账，账号/会话等其它键不动
        APP.warrantyOrders = wnData;
        APP.nonWarrantyOrders = nwData;
        APP.unclassifiedOrders = uData;
        APP.dataVersion = DATA_VERSION;
        APP.idCounters.wn = wnData.length;
        APP.idCounters.nw = nwData.length;
        afEnsureNwIds(APP);
        saveData(APP);
        DATA_STALE = false;
        renderIdentityBar();
        afApplyNavPermission();
        renderPage();
        console.log(`[${DATA_VERSION}] 已载入 保内 ${wnData.length} + 保外 ${nwData.length} + 未分类 ${uData.length}`);
      }
    } catch(e) {
      console.error('Failed to load default data:', e);
    }
  }
}

// 手动清空本机旧账并重新拉取站点台账（顶部按钮调用）
async function afReloadSeedData() {
  if (!confirm('将清空本浏览器里的全部工单数据，重新载入站点上的最新台账。账号和权限不受影响。确定继续？')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  DATA_STALE = true;
  showUploadStatus('⏳ 正在重新载入站点台账…', 'info');
  APP = getDefaultData();
  await initApp();
  showUploadStatus('✅ 已载入最新台账', 'success');
}

// ===== 登录门接管启动 =====
// 未登录时业务内容整体不可见（body.nj-locked），登录成功后才加载数据并渲染。
function afStartAfterLogin() {
  const acc = (window.NJ_GATE && NJ_GATE.current) ? NJ_GATE.current() : null;
  if (acc) {
    ME = AFG.setIdentity(acc.name, acc.role);
    if (typeof IDP !== 'undefined') IDP.setIdentity(acc.name, acc.role);
  }
  initApp();
}

if (AF_GATE_ON) {
  // 全新浏览器首次打开：预置赵轩、刘晓为管理员（口令 000000）；已有账号库时不介入。
  if (AUTH.seedAdmins) AUTH.seedAdmins();
  NJ_GATE.init({
    pageName: '工单系统',
    getNames: afNameRoster,
    onEnter: function () { afStartAfterLogin(); },
    onLeave: function () {
      // 退出后清掉侧栏身份，避免残留上一位同事的姓名
      var b = document.getElementById('identityBar');
      if (b) b.innerHTML = '';
    }
  });
  NJ_GATE.start();
} else {
  initApp();   // 账号模块未加载时退回原行为，避免整页不可用
}
