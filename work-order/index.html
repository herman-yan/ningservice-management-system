<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务站工单管理系统</title>
<style>
:root {
  --primary: #2563eb;
  --primary-light: #3b82f6;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --bg: #f1f5f9;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --sidebar-w: 220px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Sidebar */
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: #1e293b; color: #fff; z-index: 100; display: flex; flex-direction: column; }
.sidebar-brand { padding: 20px 16px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #334155; }
.sidebar-brand small { display: block; font-size: 11px; font-weight: 400; color: #94a3b8; margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; }
.nav-section { padding: 8px 16px 4px; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
.nav-item { display: flex; align-items: center; padding: 10px 16px; cursor: pointer; color: #cbd5e1; font-size: 14px; transition: all .15s; border-left: 3px solid transparent; }
.nav-item:hover { background: #334155; color: #fff; }
.nav-item.active { background: #334155; color: #60a5fa; border-left-color: var(--primary); }
.nav-item .icon { width: 20px; margin-right: 10px; text-align: center; font-size: 15px; }
.nav-badge { margin-left: auto; background: var(--primary); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 10px; }

/* Main */
.main { margin-left: var(--sidebar-w); padding: 24px; min-height: 100vh; }

/* Header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.page-title { font-size: 22px; font-weight: 700; }
.page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* Cards */
.card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.card-title .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.badge-blue { background: #dbeafe; color: var(--primary); }
.badge-green { background: #dcfce7; color: var(--success); }
.badge-yellow { background: #fef3c7; color: var(--warning); }
.badge-red { background: #fee2e2; color: var(--danger); }
.badge-gray { background: #f1f5f9; color: var(--text-secondary); }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 16px; text-align: center; }
.stat-number { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Pipeline */
.pipeline { display: flex; align-items: center; gap: 0; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px; }
.pipeline-step { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: all .15s; }
.pipeline-step:hover { border-color: var(--primary); }
.pipeline-step.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pipeline-step.done { background: #dcfce7; border-color: var(--success); color: var(--success); }
.pipeline-arrow { color: #cbd5e1; font-size: 18px; margin: 0 4px; flex-shrink: 0; }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border); white-space: nowrap; position: sticky; top: 0; }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tbody tr:hover { background: #f8fafc; }
tbody tr { cursor: pointer; }

/* Status pills */
.status-pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.status-legacy { margin-left: 4px; font-size: 11px; color: #b26a00; cursor: help; }
.status-待派工 { background: #f1f5f9; color: #64748b; }
.status-已接单 { background: #f1f5f9; color: #64748b; }
.status-待客户确认 { background: #fef3c7; color: #92400e; }
.status-在修 { background: #dbeafe; color: #1d4ed8; }
.status-已竣工 { background: #d1fae5; color: #065f46; }
.status-维修完成 { background: #d1fae5; color: #065f46; }
.status-已报单, .status-已结算 { background: #dcfce7; color: #166534; }
.status-已结清 { background: #dcfce7; color: #166534; }
.status-关闭工单 { background: #f1f5f9; color: #64748b; }
.status-已终止 { background: #fee2e2; color: #991b1b; }
.status-待班组复检 { background: #ffedd5; color: #9a3412; }
.status-待质检终检 { background: #ede9fe; color: #5b21b6; }
.status-驳回待重检 { background: #fee2e2; color: #991b1b; }
.status-报价确认 { background: #e0f2fe; color: #075985; }

/* 岗位身份条（折叠态样式由 assets/identity-panel.js 注入，此处仅保留兜底） */
.identity-bar { padding: 10px 12px; border-bottom: 1px solid #334155; background: #172033; }
.identity-bar .id-name { font-weight: 600; font-size: 13px; color: #e2e8f0; }
.identity-bar .id-role { font-size: 12px; color: #94a3b8; }
.identity-note { margin-top: 6px; font-size: 11px; line-height: 1.5; color: #64748b; background: rgba(255,255,255,.04); border-left: 3px solid #475569; padding: 6px 8px; border-radius: 4px; }
.scope-hint { margin: 0 0 14px; font-size: 12px; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; padding: 8px 12px; border-radius: 8px; }

/* 结构化质检 */
.qc-list { display: grid; gap: 6px; margin: 10px 0; }
.qc-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: #fff; }
.qc-item input { width: auto; }
.qc-gates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.qc-err { color: var(--danger); font-size: 12px; margin-top: 8px; line-height: 1.6; }
.qc-version { font-size: 11px; color: var(--text-secondary); margin-top: 6px; }

/* 操作留痕 */
.audit-list { margin-top: 8px; border-left: 2px solid var(--border); padding-left: 12px; }
.audit-row { font-size: 12px; color: var(--text-secondary); margin-bottom: 7px; line-height: 1.5; }
.audit-row b { color: var(--text); font-weight: 600; }
.qc-fact { font-size: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; line-height: 1.7; }
.qc-fact .ok { color: var(--success); }
.qc-fact .no { color: var(--danger); }

/* Type tabs */
.type-tabs { display: flex; gap: 0; margin-bottom: 20px; background: #fff; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
.type-tab { padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; border-bottom: 2px solid transparent; }
.type-tab:hover { background: #f8fafc; }
.type-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: #eff6ff; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-light); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #15803d; }
.btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
.btn-danger:hover { background: #fee2e2; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* Form */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.form-group { display: flex; flex-direction: column; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
.form-label .required { color: var(--danger); margin-left: 2px; }
.form-input, .form-select, .form-textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; transition: border-color .15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.form-textarea { min-height: 60px; resize: vertical; }
.form-input[readonly] { background: #f8fafc; color: var(--text-secondary); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-secondary); padding: 4px; }
.modal-body { padding: 24px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: #fff; }

/* Detail view */
.detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.detail-id { font-size: 18px; font-weight: 700; }
.detail-section { margin-bottom: 20px; }
.detail-section-title { font-size: 14px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 12px; color: var(--text-secondary); }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.detail-field { }
.detail-field-label { font-size: 11px; color: var(--text-secondary); }
.detail-field-value { font-size: 14px; font-weight: 500; margin-top: 2px; }

/* Timeline */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 16px; }
.timeline-item::before { content: ''; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
.timeline-item.done::before { background: var(--success); }
.timeline-item.current::before { background: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,.2); }
.timeline-time { font-size: 11px; color: var(--text-secondary); }
.timeline-content { font-size: 13px; margin-top: 2px; }

/* Filter bar */
.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filter-bar .form-input, .filter-bar .form-select { padding: 7px 10px; font-size: 13px; }
.time-filter { display: flex; gap: 0; margin-bottom: 16px; background: #fff; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; width: fit-content; }
.time-btn { padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; border: none; background: transparent; color: var(--text); border-right: 1px solid var(--border); }
.time-btn:last-child { border-right: none; }
.time-btn:hover { background: #f8fafc; }
.time-btn.active { color: var(--primary); background: #eff6ff; font-weight: 600; }
.time-filter-label { padding: 8px 12px; font-size: 12px; color: var(--text-secondary); background: #f8fafc; border-right: 1px solid var(--border); display: flex; align-items: center; }
.search-input { min-width: 200px; }

/* Actions in table */
.action-group { display: flex; gap: 4px; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 180px; font-size: 12px; }
  .sidebar-brand { font-size: 13px; padding: 8px; }
  .sidebar-brand small { font-size: 9px; }
  .nav-item { padding: 6px 8px; font-size: 11px; }
  .nav-item .icon { font-size: 13px; }
  .nav-section { font-size: 9px; padding: 5px 8px 2px; }
  .nav-badge { font-size: 9px; padding: 1px 4px; }
  .main { margin-left: 180px; }
  .form-grid { grid-template-columns: 1fr; }
  .header { padding: 8px 10px; }
  .header h1 { font-size: 14px; }
  .content { padding: 10px; }
  .stat-card { padding: 8px; }
  .stat-value { font-size: 18px; }
  .stat-label { font-size: 10px; }
}

/* Upload */
.btn-upload { background:#3b82f6; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background .15s; }
.btn-upload:hover { background:#2563eb; }
.upload-status-bar { padding:10px 24px; background:#fff; border-bottom:1px solid var(--border); font-size:13px; display:none; align-items:center; gap:8px; border-radius:0 0 10px 10px; margin-bottom:12px; }
.upload-status-bar.show { display:flex; }
.upload-status-bar.success { color:var(--success); background:#f0fdf4; border-color:#bbf7d0; }
.upload-status-bar.error { color:var(--danger); background:#fef2f2; border-color:#fecaca; }
.upload-status-bar.info { color:var(--primary); background:#eff6ff; border-color:#bfdbfe; }
.upload-badge { background:#dbeafe; color:var(--primary); padding:2px 10px; border-radius:10px; font-size:11px; font-weight:600; }

/* Import panel (dashboard) */
.import-card { border:1px solid #bfdbfe; background:linear-gradient(180deg,#f8fbff,#fff); }
.import-body { display:flex; flex-direction:column; gap:14px; }
.import-desc { font-size:13px; color:var(--text-secondary); line-height:1.75; }
.import-desc b { color:#1e293b; }
.import-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn-upload.ghost { background:#fff; color:#2563eb; border:1px solid #bfdbfe; }
.btn-upload.ghost:hover { background:#eff6ff; }
.import-hint { font-size:12px; color:#94a3b8; line-height:1.7; }
.import-result { padding:14px 16px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; }
.ir-title { font-size:13px; color:#166534; margin-bottom:10px; }
.ir-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.ir-item { background:#fff; border-radius:8px; padding:10px 12px; text-align:center; border:1px solid #e2e8f0; }
.ir-item.wn { border-color:#bfdbfe; } .ir-item.wn .ir-num { color:#2563eb; }
.ir-item.nw { border-color:#fed7aa; } .ir-item.nw .ir-num { color:#d97706; }
.ir-item.skip .ir-num { color:#94a3b8; }
.ir-num { font-size:22px; font-weight:700; color:#1e293b; }
.ir-label { font-size:11px; color:#64748b; margin-top:4px; }
@media (max-width:768px){ .ir-grid { grid-template-columns:1fr; } }

/* Print */
@media print {
  .sidebar, .btn, .filter-bar, .pipeline { display: none !important; }
  .main { margin-left: 0; }
}
</style>
</head>

<script>
// ===== DATA STORE =====
const STORAGE_KEY = 'station_mgmt_data';
// 数据版本：更换底账时递增，旧版本会被自动清空并从站点重新拉取（保证所有人看到同一份新数据）
const DATA_VERSION = 'kz-20261119-v1';
let DATA_STALE = false;

function getDefaultData() {
  return {
    warrantyOrders: [],   // 保内工单（底层口径保留）
    nonWarrantyOrders: [], // 保外工单（底层口径保留）
    unclassifiedOrders: [], // 导入时无法判定保内/保外的行，等待人工归类
    engineers: ['刘珍','罗永豪','刘星彤','段宇航','杨国志','张峻','李恩浩','李旭东','周大伟','王子辉','苏越','张高丰','张祥英','马迪','张垚','何旭栋','吴孔亮','王超杰','穆乃平','陈朝辉','赵唯','王效祖'],
    reporters: ['周字欢','刘程程','董慧莹','王鹏','赵轩'],
    warehouseLogs: [],
    idCounters: { wn: 0, nw: 0, wh: 0 }
  };
}

// 保外单据历史数据来自表格导入，只有「序号(seq)」而无内部 id；
// 而列表/详情/编辑/导出均按 id 定位。此处做一次幂等补全，
// 生成稳定的 NW-xxxxxx 编号，避免列表显示 undefined、点开无详情。
function afEnsureNwIds(data) {
  const list = (data && data.nonWarrantyOrders) || [];
  let maxN = Number((data && data.idCounters && data.idCounters.nw) || 0);
  const used = new Set();
  list.forEach(o => { if (o && o.id) used.add(String(o.id)); });
  list.forEach(o => {
    if (!o || o.id) return;
    let n;
    do { maxN++; n = 'NW-' + String(maxN).padStart(6, '0'); } while (used.has(n));
    o.id = n; used.add(n);
  });
  if (data && data.idCounters) data.idCounters.nw = Math.max(maxN, list.length);
  return data;
}

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d) {
      // 版本不一致：本次不使用旧账，等 initApp 从站点拉取新账覆盖
      if (d.dataVersion && d.dataVersion !== DATA_VERSION) {
        DATA_STALE = true;
        return getDefaultData();
      }
      return afEnsureNwIds({ ...getDefaultData(), ...d });
    }
  } catch(e) {}
  return getDefaultData();
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let APP = loadData();

// ===== 岗位身份 + 流转护栏（逻辑与用例见 assets/aftersales-guardrails.js）=====
if (typeof AFG === 'undefined') {
  document.getElementById('mainContent').innerHTML =
    '<div style="padding:40px;font-size:14px">护栏模块 <code>../assets/aftersales-guardrails.js</code> 未加载，为避免绕过状态机与质检闸门，本页已停止写入。请刷新或检查该文件是否随站点一同发布。</div>';
  throw new Error('aftersales-guardrails.js not loaded');
}
// 登录门是否就位。就位时由它统一接管身份；未就位时退回原行为，
// 避免账号模块加载失败导致整页不可用。
const AF_GATE_ON = (typeof NJ_GATE !== 'undefined' && typeof AUTH !== 'undefined');
let ME = { name: '', role: AF_GATE_ON ? 'REPORTER' : 'ADMIN' };
ME = AFG.getIdentity() || ME;
if (!ME.name && !AF_GATE_ON) ME = AFG.setIdentity((APP.engineers[0] || '未署名'), ME.role);

function afEsc(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 客户名称：可直接输入，浏览器按历史名单做模糊提示（datalist）。
// 历史名单仍保留，编辑老单据时原值不会被吞掉。
function customerInputHtml(selected, listId) {
  const id = listId || 'njCustomerList';
  const list = (typeof CUSTOMER_OPTIONS !== 'undefined' && Array.isArray(CUSTOMER_OPTIONS)) ? CUSTOMER_OPTIONS : [];
  return `<input class="form-input" id="f_wn_customerName" list="${id}" value="${afEsc(selected || '')}" placeholder="输入客户名称，可从历史客户中选择" autocomplete="off">
    <datalist id="${id}">${list.map(n => `<option value="${afEsc(n)}"></option>`).join('')}</datalist>`;
}

// 兼容旧视图：部分历史弹窗仍使用下拉点选
function customerOptionsHtml(selected) {
  const list = (typeof CUSTOMER_OPTIONS !== 'undefined' && Array.isArray(CUSTOMER_OPTIONS)) ? CUSTOMER_OPTIONS : [];
  const cur = String(selected || '');
  let html = '<option value="">-- 请选择客户 --</option>';
  html += list.map(n => `<option value="${afEsc(n)}"${cur === n ? ' selected' : ''}>${afEsc(n)}</option>`).join('');
  if (cur && list.indexOf(cur) < 0) html += `<option value="${afEsc(cur)}" selected>${afEsc(cur)}（历史记录）</option>`;
  return html;
}

// 岗位身份面板（assets/identity-panel.js）：侧栏折叠为一行，点开弹窗切换。
// 姓名名单 = 台账自动提取 ∪ 手动补充 − 手动隐藏（见 AFG.nameRoster）。
function afNameRoster() {
  try {
    return AFG.nameRoster([APP.warrantyOrders, APP.nonWarrantyOrders, APP.engineers.map(n => ({ engineer: n })), APP.reporters.map(n => ({ reporter: n }))]);
  } catch (e) { return (APP.engineers || []).slice(); }
}

function renderIdentityBar() {
  if (typeof IDP === 'undefined') return;
  IDP.init({
    pageName: '工单系统',
    getNames: afNameRoster,
    locked: AF_GATE_ON,                 // 登录门就位时身份只读，不再允许自由切换
    onChangePwd: function () { if (window.NJ_GATE) NJ_GATE.openChangePwd(); },
    onManage: function () { if (window.NJ_GATE) NJ_GATE.openPanel(); },
    onLogout: function () { if (window.NJ_GATE) NJ_GATE.logout(); }
  });
}

function afSwitchIdentity(name, role) {
  ME = AFG.setIdentity(name, role);
  renderIdentityBar();
  afApplyNavPermission();
  renderPage();
}

// 生效权限：优先取账号的个人微调，其次回落岗位默认（无账号体系时退回 AFG）
function afCanEnter(page) {
  try {
    if (typeof AUTH !== 'undefined' && ME.name) return AUTH.canEnter(ME.name, page);
  } catch (e) {}
  return AFG.canPage(ME.role, page);
}

function afApplyNavPermission() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.style.display = afCanEnter(el.dataset.page) ? '' : 'none';
  });
  if (!afCanEnter(currentPage)) switchPage('dashboard');
}

function afScopeHint() {
  return `<div class="scope-hint">当前岗位：${afEsc(AFG.roleLabel(ME.role))} · ${afEsc((AFG.ROLES[ME.role] || {}).scopeHint || '')}</div>`;
}

// 数据可见范围：账号可覆盖为「全部」或「仅本人相关」，否则跟随岗位口径
function afScopeOverride() {
  try {
    if (typeof AUTH !== 'undefined' && ME.name) return AUTH.effectiveScope(ME.name);
  } catch (e) {}
  return 'role';
}
function afApplyScope(list, linkIndex) {
  const sc = afScopeOverride();
  if (sc === 'all') return list.slice();
  if (sc === 'own') {
    return list.filter(o => [o.engineer, o.repairEngineer].concat(o.coEngineers || [])
      .some(n => AFG.samePerson(n, ME.name)) || AFG.samePerson(o.reporter, ME.name));
  }
  return AFG.visibleOrders(ME.role, list, ME, linkIndex);
}
function afWarranty() { return afApplyScope(APP.warrantyOrders); }
function afNonWarranty() {
  const idx = {};
  APP.warehouseLogs.forEach(l => { if (l.relatedOrder) idx[l.relatedOrder] = true; });
  return afApplyScope(APP.nonWarrantyOrders, idx);
}

function afFindOrder(kind, id) {
  return (kind === 'WN' ? APP.warrantyOrders : APP.nonWarrantyOrders).find(x => x.id === id);
}

// 保外定位：优先按 id，回退按序号（seq），兼容未补全 id 的历史数据
function afFindNw(id) {
  if (!id) return null;
  return APP.nonWarrantyOrders.find(x => x.id === id)
      || APP.nonWarrantyOrders.find(x => String(x.seq) === String(id))
      || null;
}
function afIndexOfNw(id) {
  if (!id) return -1;
  let i = APP.nonWarrantyOrders.findIndex(x => x.id === id);
  if (i < 0) i = APP.nonWarrantyOrders.findIndex(x => String(x.seq) === String(id));
  return i;
}
function afTransitionOf(kind, status, action) {
  return AFG.allowedTransitions(kind, status).find(t => t.action === action);
}

// 导入/新建时的状态口径：只按流转模板归一（旧口径别名转换），认不出的值不静默改写——
// 保留 statusRaw 并退回入口态，等人工在台账里确认后再走流转。
function afNormalizeIncoming(kind, raw) {
  const s = String(raw || '').trim();
  if (!s) return { status: AFG.flowOf(kind).entry, raw: '', unknown: false };
  const mapped = AFG.normalizeStatus(kind, s);
  if (!AFG.isKnownStatus(kind, mapped)) return { status: AFG.flowOf(kind).entry, raw: s, unknown: true };
  return { status: mapped, raw: mapped === s ? '' : s, unknown: false };
}

// 入口态赋值：新建单直接落状态机入口；导入单走归一，认不出的状态留痕待人工确认
function afAssignIncomingStatus(kind, o, raw) {
  const n = afNormalizeIncoming(kind, raw);
  o.status = n.status;
  if (n.raw) o.statusRaw = n.raw;
  if (n.unknown) AFG.appendAudit(o, { action: 'import', to: n.status, actor: ME, note: '导入状态「' + n.raw + '」不在流转模板 ' + AFG.flowOf(kind).version + ' 内，已退回入口态，需人工确认后续流转' });
  return n;
}

// 导入合并：匹配键去重、空值不覆盖，但 status / statusRaw 不回写——
// 已存在单据的流程位置以本机台账流转为准，不能被一张旧表倒退。
function afMergeInto(existing, incoming, keyFn) {
  const fields = Object.keys(incoming[0] || {}).filter(f => f !== 'status' && f !== 'statusRaw');
  return AFG.mergeImport(existing, incoming, keyFn, fields);
}

// 状态徽标：显式暴露「由旧口径归一而来」与「模板认不出的脏状态」，避免台账被误读；状态值一律转义后入 DOM
function afStatusPill(kind, o) {
  // 展示统一按当前口径（旧「已结算」显示为「已报单」），原值留痕不丢
  const norm = AFG.normalizeStatus(kind, o.status);
  const s = afEsc(norm);
  if (!AFG.isKnownStatus(kind, norm)) return `<span class="status-pill">${afEsc(o.status)} · 状态待确认</span>`;
  const legacy = o.statusRaw || (norm !== o.status ? o.status : '');
  const tag = legacy ? `<span class="status-legacy" title="原状态「${afEsc(legacy)}」，已按流转模板 ${afEsc(AFG.flowOf(kind).version)} 归一">原「${afEsc(legacy)}」</span>` : '';
  return `<span class="status-pill status-${s}">${s}</span>${tag}`;
}

// 派单成功后推送钉钉提醒。提醒失败不阻断工单流转，结果回写状态栏，并提供手动重试。
let lastDispatchNotice = null;
function pushDispatchNotice(kind, order, engineer, doneMsg, opts) {
  if (!engineer) return;
  opts = opts || {};
  const operator = (typeof ME !== 'undefined' && ME && ME.name) ? ME.name : '';
  lastDispatchNotice = { kind: kind, order: order, engineer: engineer, doneMsg: doneMsg, operator: operator };
  if (typeof DISPATCH_NOTIFY === 'undefined') {
    showUploadStatus((doneMsg || '派单已完成') + '；钉钉提醒模块未加载', 'error');
    return;
  }
  const label = kind === 'WN' ? '保内' : '保外';
  DISPATCH_NOTIFY.notify(label, order, engineer, operator, { force: !!opts.force }).then(r => {
    let tail;
    if (r.ok) {
      tail = '钉钉提醒已推送给 ' + afEsc(engineer) + (r.atMatched ? '（已@）' : '（未设置@名单，群里不会@到本人）');
    } else if (r.skipped) {
      tail = '近期已推送过相同提醒，已自动跳过';
    } else {
      tail = '钉钉提醒未送达（' + afEsc(r.msg) + '）' +
        ' <button class="btn btn-sm btn-outline" style="margin-left:8px" onclick="retryDispatchNotice()">重试提醒</button>';
    }
    showUploadStatus((doneMsg || '派单已完成') + '；' + tail, r.ok ? 'success' : 'error');
  });
}

function retryDispatchNotice() {
  const n = lastDispatchNotice;
  if (!n) return;
  pushDispatchNotice(n.kind, n.order, n.engineer, n.doneMsg, { force: true });
}

// ===== 钉钉@名单设置（管理员）=====
// @提醒需要钉钉群内成员的手机号或 UserId；名单保存在转发服务，所有使用本系统的电脑共享。
let atDirCache = {};
let atNamesCache = [];

function afAtEngineerNames() {
  const set = new Set(APP.engineers || []);
  [APP.warrantyOrders, APP.nonWarrantyOrders, APP.unclassifiedOrders].forEach(list => {
    (list || []).forEach(o => {
      const n = o.engineer || o.repairEngineer || '';
      if (n) set.add(n);
      (o.coEngineers || []).forEach(c => { if (c) set.add(c); });
    });
  });
  Object.keys(atDirCache || {}).forEach(n => set.add(n));
  return Array.from(set).filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), 'zh-CN'));
}

function syncAtDirectoryOnBoot() {
  if (!digestAutoEnabled()) return;
  if (typeof DISPATCH_NOTIFY === 'undefined' || !DISPATCH_NOTIFY.getAtDirectory) return;
  DISPATCH_NOTIFY.getAtDirectory().then(r => {
    if (!r.ok) return;
    atDirCache = r.directory || {};
    if (!Object.keys(atDirCache).length) {
      // 转发服务若重启丢失文件，用管理员本机备份恢复一次
      try {
        const local = JSON.parse(localStorage.getItem('nj_at_directory') || '{}');
        if (Object.keys(local).length) {
          DISPATCH_NOTIFY.saveAtDirectory(local).then(x => {
            if (x.ok) { atDirCache = local; console.log('[钉钉@名单] 已从本机备份恢复 ' + Object.keys(local).length + ' 人'); }
          });
        }
      } catch (e) { /* 本机无备份则忽略 */ }
    } else {
      try { localStorage.setItem('nj_at_directory', JSON.stringify(atDirCache)); } catch (e) {}
    }
  });
}

function openAtSettings() {
  if (ME.role !== 'ADMIN') return showUploadStatus('仅管理员可设置钉钉@名单', 'error');
  if (typeof DISPATCH_NOTIFY === 'undefined' || !DISPATCH_NOTIFY.getAtDirectory) {
    return showUploadStatus('钉钉提醒模块未加载', 'error');
  }
  showUploadStatus('正在读取钉钉@名单…', 'info');
  DISPATCH_NOTIFY.getAtDirectory().then(r => {
    if (!r.ok) return showUploadStatus('读取名单失败：' + afEsc(r.msg || ''), 'error');
    atDirCache = r.directory || {};
    renderAtSettingsModal();
  });
}

function renderAtSettingsModal() {
  atNamesCache = afAtEngineerNames();
  const rows = atNamesCache.map((n, i) => {
    const d = atDirCache[n] || {};
    const mobile = typeof d === 'string' ? (/^1\d{10}$/.test(d) ? d : '') : (d.mobile || '');
    const uid = typeof d === 'string' ? (/^1\d{10}$/.test(d) ? '' : d) : (d.userId || '');
    return `<tr>
      <td style="padding:6px 8px;font-weight:600">${afEsc(n)}</td>
      <td style="padding:6px 8px"><input class="form-input" id="at_m_${i}" value="${afEsc(mobile)}" placeholder="11位手机号" style="width:150px"></td>
      <td style="padding:6px 8px"><input class="form-input" id="at_u_${i}" value="${afEsc(uid)}" placeholder="钉钉UserId" style="width:150px"></td>
      <td style="padding:6px 8px"><button class="btn btn-sm btn-outline" onclick="testAtNotice(${i})">测试@</button></td>
    </tr>`;
  }).join('');
  showModal(`
    <div class="modal-header">
      <div class="modal-title">钉钉@名单设置</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.7;margin-bottom:14px">
        钉钉群机器人只有拿到成员的<b>手机号</b>或<b>UserId</b>才能真正 @ 到本人，仅填姓名不会触发提醒。<br>
        填好保存后，之后每次派单提醒都会自动 @ 对应工程师；留空的工程师照常收到普通提醒。
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="text-align:left;color:var(--text-secondary);font-size:12px">
          <th style="padding:6px 8px">工程师</th><th style="padding:6px 8px">手机号</th><th style="padding:6px 8px">UserId</th><th style="padding:6px 8px">操作</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="padding:16px;color:var(--text-secondary)">暂无工程师名单</td></tr>'}</tbody>
      </table>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:10px">名单可通过台账中的工程师自动汇总；设置会保存到钉钉转发服务，所有电脑共用。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveAtSettings()">保存名单</button>
    </div>
  `);
}

function saveAtSettings() {
  const dir = {};
  atNamesCache.forEach((n, i) => {
    const mEl = document.getElementById('at_m_' + i);
    const uEl = document.getElementById('at_u_' + i);
    const m = mEl ? mEl.value.trim() : '';
    const u = uEl ? uEl.value.trim() : '';
    if (m || u) dir[n] = { mobile: m, userId: u };
  });
  DISPATCH_NOTIFY.saveAtDirectory(dir).then(r => {
    if (!r.ok) return showUploadStatus('名单保存失败：' + afEsc(r.msg || ''), 'error');
    atDirCache = dir;
    try { localStorage.setItem('nj_at_directory', JSON.stringify(dir)); } catch (e) {}
    showUploadStatus('钉钉@名单已保存' + (r.persisted ? '' : '（本服务重启后需重新设置）'), 'success');
  });
}

function testAtNotice(i) {
  const n = atNamesCache[i];
  if (!n) return;
  const order = {
    id: 'TEST-' + String(Date.now()).slice(-6),
    customerName: '@设置测试',
    vehicleInfo: '—',
    faultDesc: '这是一条@功能测试提醒，请忽略'
  };
  pushDispatchNotice('WN', order, n, '测试提醒');
}

// 统一的流转出口：所有状态变化都经过这里，保证合法性、幂等、质检事实与留痕
function afCommit(kind, id, action, payload) {
  const o = afFindOrder(kind, id);
  if (!o) return showUploadStatus('工单不存在，或当前岗位无权查看', 'error');
  const t = afTransitionOf(kind, o.status, action);
  if (!t) return showUploadStatus('当前状态「' + o.status + '」没有该操作，请刷新后以台账当前状态为准', 'error');
  payload = Object.assign({ requestId: AFG.newRequestId() }, payload || {});
  o._flowKind = kind;
  const res = AFG.applyTransition(o, t, ME, payload);
  delete o._flowKind;
  if (!res.ok) return showUploadStatus(res.error, 'error');
  const flow = kind === 'WN' ? AFG.WN_FLOW : AFG.NW_FLOW;
  if (!o.flowTemplateVersion) { o.flowTemplateVersion = flow.version; o.flowTemplateEffectiveAt = flow.effectiveAt; }
  if (action === 'dispatch') o.engineer = payload.engineer;
  if (action === 'start') o.startDate = todayStr();
  if (action === 'close') o.dealDate = o.dealDate || todayStr();
  if (action === 'clear') o.clearedDate = todayStr();
  if (action === 'cancel') o.cancelledDate = todayStr();
  saveData(APP);
  closeModal();
  renderPage();
  const flowMsg = '已流转至「' + o.status + '」，操作已留痕';
  if (action === 'dispatch') {
    showUploadStatus(flowMsg + '，正在推送钉钉提醒…', 'info');
    pushDispatchNotice(kind, o, payload.engineer, flowMsg);
  } else {
    showUploadStatus(flowMsg, 'success');
  }
}

// 通用动作弹窗：按动作类型选择要采集的事实
function afOpenAction(kind, id, action) {
  const o = afFindOrder(kind, id);
  if (!o) return;
  const t = afTransitionOf(kind, o.status, action);
  if (!t) return showUploadStatus('当前状态不允许该操作', 'error');
  if (action === 'dispatch') return dispatchWarranty(id);
  if (action === 'settle') return settleWarranty(id);
  if (t.stage === 'SELF') return afOpenQcModal(kind, id);

  let body = '';
  if (t.stage === 'TEAM' || t.stage === 'FINAL') body = afQcFactsHtml(o);
  else if (t.requiresReason || action === 'cancel') {
    body = `<div class="form-group full"><label class="form-label">原因<span class="required">*</span></label>
      <textarea class="form-textarea" id="af_reason" placeholder="必填：写明原因，便于后续审计回放"></textarea></div>`;
  } else if (action === 'close') {
    body = '<div class="qc-fact">关闭前请确认费用已结清、资料已归档。关闭动作会写入操作留痕，不可直接改状态。</div>';
  }
  const html = `
    <div class="modal-header"><div class="modal-title">${afEsc(t.label)} - ${afEsc(o.id)}</div>
      <button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="qc-fact">当前状态：<b>${afEsc(o.status)}</b> → 目标状态：<b>${afEsc(t.to)}</b>　操作人：${afEsc(ME.name)}（${afEsc(AFG.roleLabel(ME.role))}）</div>
      ${body}
      <div class="form-group full" style="margin-top:10px"><label class="form-label">备注（可选）</label>
        <textarea class="form-textarea" id="af_note" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="afConfirmAction('${kind}','${o.id}','${action}')">确认</button>
    </div>`;
  showModal(html);
}

function afConfirmAction(kind, id, action) {
  const payload = { note: (document.getElementById('af_note') || {}).value || '' };
  const reasonEl = document.getElementById('af_reason');
  if (reasonEl) payload.reason = reasonEl.value.trim();
  afCommit(kind, id, action, payload);
}

// ===== 结构化质检：11 项清单 + 数值门槛 =====
function afOpenQcModal(kind, id) {
  const o = afFindOrder(kind, id);
  const html = `
    <div class="modal-header"><div class="modal-title">技师自检申报竣工 - ${afEsc(o.id)}</div>
      <button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="qc-fact">清单模板：${afEsc(AFG.QC_TEMPLATE_VERSION)}　申报人：${afEsc(ME.name)}（${afEsc(AFG.roleLabel(ME.role))}）<br>
        11 项须全部确认通过，三项数值门槛须如实填写；未通过项会阻断提交。</div>
      <div class="qc-list">
        ${AFG.QC_ITEMS.map(i => `
          <label class="qc-item"><input type="checkbox" id="qc_${i.code}"><span>${afEsc(i.label)}</span></label>`).join('')}
      </div>
      <div class="qc-gates">
        <div class="form-group"><label class="form-label">绝缘阻值(mΩ)</label><input class="form-input" type="number" step="0.01" id="qc_insulationMohm"></div>
        <div class="form-group"><label class="form-label">容量恢复率(%)</label><input class="form-input" type="number" step="0.01" id="qc_capacityRecoveryPct" placeholder="95 ~ 999.99"></div>
        <div class="form-group"><label class="form-label">72小时压降(mV)</label><input class="form-input" type="number" step="0.01" id="qc_voltageDrop72hMv" placeholder="0 ~ 30"></div>
      </div>
      <div class="form-group full" style="margin-top:10px"><label class="form-label">完工日期 / 工程师备注</label>
        <div style="display:grid;grid-template-columns:1fr;gap:8px">
          <input class="form-input" type="date" id="comp_date" value="${todayStr()}">
        </div>
        <textarea class="form-textarea" id="comp_note" rows="2" placeholder="维修情况、更换配件等" style="margin-top:8px"></textarea>
      </div>
      <div class="qc-err" id="afQcErr"></div>
      <div class="qc-version">提交后直接进入「待质检终检」；终检须由技师以外的人执行（责任分离），通过即可竣工。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-success" onclick="afSubmitQc('${kind}','${o.id}')">确认自检合格并申报</button>
    </div>`;
  showModal(html);
}

function afSubmitQc(kind, id) {
  const val = i => (document.getElementById(i) || {}).value;
  const qc = {
    items: AFG.QC_CODES.map(c => ({ code: c, passed: !!(document.getElementById('qc_' + c) || {}).checked })),
    insulationMohm: val('qc_insulationMohm'),
    capacityRecoveryPct: val('qc_capacityRecoveryPct'),
    voltageDrop72hMv: val('qc_voltageDrop72hMv')
  };
  const v = AFG.validateQC(qc);
  if (!v.ok) {
    document.getElementById('afQcErr').innerHTML = v.errors.map(e => '· ' + afEsc(e)).join('<br>');
    return;
  }
  const o = afFindOrder(kind, id);
  o.completeDate = val('comp_date');
  o.engineerNote = val('comp_note');
  // 工程师产值已取消录入；历史字段 engineerOutput 保留只读备查
  // applyTransition 的结构化质检约定放在 payload.qc 下（stampQc 也按此留档）
  afCommit(kind, id, 'self_check', { qc: qc, note: val('comp_note') });
}

function afQcFactsHtml(o) {
  const q = (o && o.qc) || {};
  if (!q.self) return '<div class="qc-err">该单为历史数据，没有技师自检事实。请补录自检后再走复检/终检。</div>';
  const g = q.self.qc || {};
  const rows = AFG.QC_ITEMS.map(i => {
    const it = (g.items || []).find(x => x.code === i.code) || {};
    return `<span class="${it.passed ? 'ok' : 'no'}">${it.passed ? '✓' : '✗'} ${afEsc(i.label)}</span>`;
  }).join('　');
  return `<div class="qc-fact">
      <b>技师自检事实</b>（${afEsc(q.self.name)}，${afEsc(q.self.templateVersion || '')}）<br>${rows}<br>
      绝缘阻值 ${afEsc(g.insulationMohm)} mΩ · 容量恢复率 ${afEsc(g.capacityRecoveryPct)}% · 72h 压降 ${afEsc(g.voltageDrop72hMv)} mV
      ${q.team ? '<br><b>班组复检</b>：' + afEsc(q.team.name) + ' ' + afEsc(q.team.result) : ''}
      ${q.final ? '<br><b>质检终检</b>：' + afEsc(q.final.name) + ' ' + afEsc(q.final.result) : ''}
    </div>
    <div class="qc-version">复核须与自检不同人：同一人承担自检与复检/终检会被拒绝。</div>`;
}

function afAuditHtml(o) {
  const list = (o && o.audit) || [];
  if (!list.length) return '<div class="audit-row">暂无操作留痕（该单尚未在新流转规则下发生变更）。</div>';
  return list.slice().reverse().map(a => `
    <div class="audit-row"><b>${afEsc(a.roleLabel || a.role)}</b> ${afEsc(a.actor)} ·
      ${afEsc(a.from || '-')} → ${afEsc(a.to)} · ${afEsc((a.at || '').replace('T', ' ').slice(0, 16))}
      ${a.reason ? '<br>原因：' + afEsc(a.reason) : ''}
      ${a.note ? '<br>备注：' + afEsc(a.note) : ''}</div>`).join('');
}

// ===== 备注明细：把一个工单上所有来源的备注汇总，详情与管理员总览共用 =====
function afNoteEntries(kind, o) {
  const out = [];
  const add = (source, text, who, at) => {
    const s = String(text == null ? '' : text).trim();
    if (s) out.push({
      kind: kind, id: o.id || '-',
      customer: o.customerName || o.signedCustomer || '-',
      source: source, text: s, who: who || '-', at: at || ''
    });
  };
  add('中台备注', o.platformNote, '', '');
  add('工程师进度备注', o.engineerProgressNote, o.engineer || '', '');
  add('库房备注', o.warehouseNote, '', '');
  add('旧件备注', o.oldPartNote, '', '');
  add('业务复盘', o.reviewNote, '', '');
  add('备注', o.remark, '', '');
  (o.transferRequests || []).forEach(r => {
    add('协同申请原因', r.reason, r.from, r.at);
    add('协同审批说明', r.decisionNote, r.decidedBy, r.decidedAt);
  });
  if (o.qc && o.qc.rejectedBy) add('质检驳回原因', o.qc.rejectedBy.reason, o.qc.rejectedBy.name, o.qc.rejectedBy.at);
  (o.audit || []).forEach(a => {
    const tag = a.roleLabel || (typeof AFG !== 'undefined' && AFG.roleLabel ? AFG.roleLabel(a.role) : a.role) || '流转';
    if (a.reason) add('操作原因（' + tag + '）', a.reason, a.actor, a.at);
    if (a.note) add('流转备注（' + tag + '）', a.note, a.actor, a.at);
  });
  return out;
}

function afNotesHtml(entries) {
  if (!entries.length) return '<div style="color:var(--text-secondary);font-size:13px;padding:6px 2px">该工单暂无备注。</div>';
  return '<div style="display:grid;gap:8px">' + entries.map(n => `
    <div style="border:1px solid var(--border);border-radius:8px;padding:8px 10px">
      <div style="font-size:12px;color:var(--text-secondary)">${afEsc(n.source)} · ${afEsc(n.who)} · ${afEsc(String(n.at).replace('T', ' ').slice(0, 16))}</div>
      <div style="font-size:13px;margin-top:4px;white-space:pre-wrap">${afEsc(n.text)}</div>
    </div>`).join('') + '</div>';
}

// 管理员专用：一览所有工单上、所有人写的备注
let allNotesCache = [];
function afAllNoteEntries() {
  const out = [];
  afAllOrders().forEach(x => afNoteEntries(x.kind, x.o).forEach(n => out.push(n)));
  return out;
}
function renderAllNotesBody() {
  const q = String((document.getElementById('allNotesSearch') || {}).value || '').trim().toLowerCase();
  const type = String((document.getElementById('allNotesType') || {}).value || '');
  const list = allNotesCache.filter(n =>
    (!q || [n.id, n.customer, n.text, n.who, n.source].join(' ').toLowerCase().indexOf(q) >= 0) &&
    (!type || n.source.indexOf(type) >= 0));
  const el = document.getElementById('allNotesBody');
  if (!el) return;
  el.innerHTML = list.length ? list.map(n => `
    <tr>
      <td style="font-weight:600">${afEsc(n.id)}</td>
      <td>${afEsc(n.customer)}</td>
      <td>${afEsc(n.source)}</td>
      <td>${afEsc(n.who)}</td>
      <td style="white-space:pre-wrap;max-width:420px">${afEsc(n.text)}</td>
      <td>${afEsc(String(n.at).replace('T', ' ').slice(0, 16))}</td>
    </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:24px">没有匹配的备注</td></tr>';
}
function openAllNotes() {
  if (ME.role !== 'ADMIN') return showUploadStatus('仅管理员可查看全部备注', 'error');
  allNotesCache = afAllNoteEntries();
  const types = Array.from(new Set(allNotesCache.map(n => n.source)));
  showModal(`
    <div class="modal-header"><div class="modal-title">全部工单备注（共 ${allNotesCache.length} 条）</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">中台、工程师、库房、旧件以及流转过程中填写的备注都在这里，可按工单、客户、填写人或内容搜索。</div>

        <select class="form-select" id="allNotesType" onchange="renderAllNotesBody()">
          <option value="">全部类型</option>

      </table></div>

// ===== 一单双工程师：工程师提报协同申请，管理员批准后新增协同工程师 =====
function afEngineerNames(kind, o) {
  const arr = [o && (kind === 'WN' ? o.engineer : o.repairEngineer)].concat((o && o.coEngineers) || []);
  return arr.filter(Boolean);
}

function afPendingTransfers() {
  const out = [];
  afAllOrders().forEach(x => {
    ((x.o.transferRequests || []).filter(r => r.status === '待审批')).forEach(r => {
      out.push({ kind: x.kind, o: x.o, req: r });
    });
  });
  return out;
}

function openTransferRequest(kind, id) {
  const o = afFindOrder(kind, id);
  if (!o) return;
  const busy = afEngineerNames(kind, o);
  const candidates = (APP.engineers || []).filter(e => busy.indexOf(e) < 0);
  showModal(`
    <div class="modal-header"><div class="modal-title">申请协同转单 - ${afEsc(o.id)}</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="qc-fact">当前工程师：<b>${afEsc(busy.join('、') || '未指定')}</b>。提交后由管理员审批；批准后新工程师作为协同工程师加入本单，两人共同完成。</div>
      <div class="form-group full" style="margin-top:10px">
        <label class="form-label">接手工程师<span class="required">*</span></label>
        <select class="form-select" id="tr_to">
          <option value="">-- 请选择 --</option>
          ${candidates.map(e => `<option value="${afEsc(e)}">${afEsc(e)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group full" style="margin-top:10px">
        <label class="form-label">申请原因<span class="required">*</span></label>
        <textarea class="form-textarea" id="tr_reason" rows="3" placeholder="例如：本人需支援其他站点，剩余均衡工序请张峻接手"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitTransferRequest('${kind}','${afEsc(o.id)}')">提交申请</button>
    </div>`);
}

function submitTransferRequest(kind, id) {
  const o = afFindOrder(kind, id);
  if (!o) return;
  const to = (document.getElementById('tr_to') || {}).value || '';
  const reason = ((document.getElementById('tr_reason') || {}).value || '').trim();
  if (!to || !reason) { alert('请选择接手工程师并填写申请原因'); return; }
  o.transferRequests = o.transferRequests || [];
  o.transferRequests.unshift({
    id: 'TR-' + String(Date.now()).slice(-8),
    from: ME.name, to: to, reason: reason,
    at: new Date().toISOString(), status: '待审批'
  });
  AFG.appendAudit(o, { action: 'transfer_request', from: o.status, to: o.status, actor: ME, note: '申请 ' + to + ' 协同：' + reason });
  saveData(APP);
  closeModal();
  renderPage();
  showUploadStatus('协同申请已提交，等待管理员审批', 'success');
}

function afRenderTransferRequests(list) {
  if (!list.length) return '<div style="color:var(--text-secondary);font-size:13px;padding:6px 2px">✅ 暂无待审批的协同申请</div>';
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px">' +
    list.slice(0, 20).map(x => `
      <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px">
        <div style="font-weight:600;font-size:13px">${afEsc(x.o.id)} · ${afEsc(x.req.from)} → ${afEsc(x.req.to)}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:5px">${afEsc(x.req.reason)}</div>
        <div style="font-size:12px;margin-top:7px;display:flex;gap:6px">
          <button class="btn btn-sm btn-primary" onclick="openTransferDecision('${x.kind}','${afEsc(x.o.id)}','${afEsc(x.req.id)}',true)">批准协同</button>
          <button class="btn btn-sm btn-outline" onclick="openTransferDecision('${x.kind}','${afEsc(x.o.id)}','${afEsc(x.req.id)}',false)">驳回</button>
        </div>
      </div>`).join('') + '</div>';
}

function openTransferDecision(kind, id, reqId, approve) {
  showModal(`
    <div class="modal-header"><div class="modal-title">${approve ? '批准协同申请' : '驳回协同申请'} - ${afEsc(id)}</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="qc-fact">${approve ? '批准后该工程师将作为协同工程师加入本单，两人共同完成，并收到钉钉提醒。' : '请写明驳回原因，便于申请人调整。'}</div>
      <div class="form-group full" style="margin-top:10px">
        <label class="form-label">${approve ? '备注（可选）' : '驳回原因<span class="required">*</span>'}</label>
        <textarea class="form-textarea" id="tr_decision_note" rows="3"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmTransferDecision('${kind}','${afEsc(id)}','${afEsc(reqId)}',${approve ? 'true' : 'false'})">确认</button>
    </div>`);
}

function confirmTransferDecision(kind, id, reqId, approve) {
  const o = afFindOrder(kind, id);
  if (!o) return;
  const req = (o.transferRequests || []).find(r => r.id === reqId && r.status === '待审批');
  if (!req) return showUploadStatus('该申请已处理，请刷新后查看', 'error');
  const note = ((document.getElementById('tr_decision_note') || {}).value || '').trim();
  if (!approve && !note) { alert('请填写驳回原因'); return; }
  req.status = approve ? '已批准' : '已驳回';
  req.decidedBy = ME.name;
  req.decidedAt = new Date().toISOString();
  req.decisionNote = note;
  o.coEngineers = o.coEngineers || [];
  if (approve && o.coEngineers.indexOf(req.to) < 0) o.coEngineers.push(req.to);
  AFG.appendAudit(o, {
    action: approve ? 'transfer_approve' : 'transfer_reject',
    from: o.status, to: o.status, actor: ME,
    note: (approve ? '批准 ' : '驳回 ') + req.from + ' → ' + req.to + ' 协同申请' + (note ? '：' + note : '')
  });
  saveData(APP);
  closeModal();
  renderPage();
  if (approve) {
    pushDispatchNotice(kind, o, req.to, '已批准 ' + req.from + ' → ' + req.to + ' 协同');
  } else {
    showUploadStatus('协同申请已驳回', 'success');
  }
}

function openEngineerNote(kind, id) {

function saveEngineerNote(kind, id) {

  o.engineerProgressNote = v;

function afActionButtons(kind, o) {
  const acts = AFG.actionable(kind, o, ME);
  let extra = '';
  // 工程师接单后即可记录待料/工序进度，不必等到开工；管理员同样可代填。
  if (['已接单', '在修'].indexOf(o.status) >= 0 && !AFG.isReadonly(ME.role) &&
      ['TECHNICIAN', 'DISPATCHER', 'ADMIN'].indexOf(ME.role) >= 0) {
    extra += `<button class="btn btn-sm btn-outline" onclick="openEngineerNote('${kind}','${afEsc(o.id)}')">工程师备注</button>`;
  }
  if (['已接单', '在修'].indexOf(o.status) >= 0 && !AFG.isReadonly(ME.role) &&
      ['TECHNICIAN', 'ADMIN'].indexOf(ME.role) >= 0 && afEngineerNames(kind, o).length) {
    extra += `<button class="btn btn-sm btn-outline" onclick="openTransferRequest('${kind}','${afEsc(o.id)}')">申请协同</button>`;
  }
  if (!acts.length) return extra || (AFG.isReadonly(ME.role) ? '<span style="font-size:12px;color:var(--text-secondary)">只读岗位</span>' : '');
  return extra + acts.map(t => {
    const cls = t.action === 'cancel' || t.action === 'reject' ? 'btn btn-sm btn-outline' :
      (t.action === 'clear' || t.action === 'close' ? 'btn btn-sm btn-outline' : 'btn btn-sm btn-primary');
    return `<button class="${cls}" onclick="afOpenAction('${kind}','${afEsc(o.id)}','${t.action}')">${afEsc(t.label)}</button>`;
  }).join('');
}


function genId(prefix) {
  APP.idCounters[prefix]++;
  saveData(APP);
  const n = String(APP.idCounters[prefix]).padStart(6, '0');
  return prefix === 'wn' ? `WN-${n}` : `NW-${n}`;
}

// ===== PAGE ROUTER =====
let currentPage = 'allorders';

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  renderPage();
}

function renderPage() {
  const main = document.getElementById('mainContent');
  switch(currentPage) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'allorders': main.innerHTML = renderAllOrders(); break;
    case 'warranty': main.innerHTML = renderWarrantyList(); break;
    case 'nonwarranty': main.innerHTML = renderNonWarrantyList(); break;
    case 'warehouse': main.innerHTML = renderWarehouse(); break;
    case 'engineers': main.innerHTML = renderEngineers(); break;
    case 'export': main.innerHTML = renderExport(); break;
  }
  updateNavBadges();
}

function updateNavBadges() {
  const wnActive = afWarranty().filter(o => AFG.isActive('WN', o.status)).length;
  const nwActive = afNonWarranty().filter(o => AFG.isActive('NW', o.status)).length;
  const uCount = (APP.unclassifiedOrders || []).length;
  const badge = document.getElementById('nav-badge-allorders');
  if (badge) badge.textContent = wnActive + nwActive + uCount;
  const oldWn = document.getElementById('nav-badge-wn');
  const oldNw = document.getElementById('nav-badge-nw');
  if (oldWn) oldWn.textContent = wnActive;
  if (oldNw) oldNw.textContent = nwActive;
}

// ===== DASHBOARD =====
function renderDashboard() {
  const wn = afWarranty();
  const nw = afNonWarranty();
  const wnActive = wn.filter(o => AFG.isActive('WN', o.status));
  const nwActive = nw.filter(o => AFG.isActive('NW', o.status));
  const wnUnassigned = wn.filter(o => o.status === '未派工').length;
  const nwPending = nw.filter(o => o.status === '待客户确认').length;
  const wnInProgress = wn.filter(o => ['在修','已竣工'].includes(o.status)).length;
  const nwInProgress = nw.filter(o => o.status === '维修完成').length;
  const totalRevenue = nw.reduce((s, o) => s + (parseFloat(o.receivedAmount) || 0), 0);
  const wnRevenue = wn.reduce((s, o) => s + (parseFloat(o.totalFee) || 0), 0);

  // 时间维度统计
  const wnToday = wn.filter(o => isInPeriod(o.registerDate, 'today'));
  const nwToday = nw.filter(o => isInPeriod(o.requestDate, 'today'));
  const wnWeek = wn.filter(o => isInPeriod(o.registerDate, 'week'));
  const nwWeek = nw.filter(o => isInPeriod(o.requestDate, 'week'));
  const wnMonth = wn.filter(o => isInPeriod(o.registerDate, 'month'));
  const nwMonth = nw.filter(o => isInPeriod(o.requestDate, 'month'));
  const revToday = nwToday.reduce((s,o) => s + (parseFloat(o.receivedAmount)||0), 0) + wnToday.reduce((s,o) => s + (parseFloat(o.totalFee)||0), 0);
  const revWeek = nwWeek.reduce((s,o) => s + (parseFloat(o.receivedAmount)||0), 0) + wnWeek.reduce((s,o) => s + (parseFloat(o.totalFee)||0), 0);
  const revMonth = nwMonth.reduce((s,o) => s + (parseFloat(o.receivedAmount)||0), 0) + wnMonth.reduce((s,o) => s + (parseFloat(o.totalFee)||0), 0);

  return `
    <div class="page-header">

          <div class="ir-item wn"><div class="ir-num">${wn ? (wn.added + wn.updated) : 0}</div><div class="ir-label">保内入库（新增${wn ? wn.added : 0}/更新${wn ? wn.updated : 0}）</div></div>
          <div class="ir-item nw"><div class="ir-num">${nw ? (nw.added + nw.updated) : 0}</div><div class="ir-label">保外入库（新增${nw ? nw.added : 0}/更新${nw ? nw.updated : 0}）</div></div>

          支持三种情形：整张表为保内、整张表为保外，或<b>同一张表内保内保外混排</b>（含「类型 / 保修 / 保内保外」列时按该列逐行判定）；多工作表（Sheet）会一并处理。

        <div class="import-hint">

        <div class="import-hint">🔒 当前岗位（${afEsc(AFG.roleLabel(ME.role))}）为只读，不能导入台账；如需操作请切换岗位。</div>`}

      </div>

}

function renderStatusChart(orders, statuses) {
  const counts = statuses.map(s => orders.filter(o => o.status === s).length);
  const max = Math.max(...counts, 1);
  const colors = ['#64748b','#94a3b8','#3b82f6','#22c55e','#16a34a','#15803d','#dc2626'];
  return `<div style="display:flex;flex-direction:column;gap:8px">
    ${statuses.map((s,i) => `
      <div style="display:flex;align-items:center;gap:10px">
        <span style="width:80px;font-size:12px;color:var(--text-secondary);text-align:right">${s}</span>
        <div style="flex:1;height:22px;background:#f1f5f9;border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${counts[i]/max*100}%;background:${colors[i%colors.length]};border-radius:4px;transition:width .3s;min-width:${counts[i]>0?'4px':'0'}"></div>
        </div>
        <span style="width:30px;font-size:13px;font-weight:600">${counts[i]}</span>
      </div>
    `).join('')}
  </div>`;
}

// ===== 统一工单总览：底层仍是保内/保外两套台账，界面合并并按标签区分 =====
let allCatFilter = '', allStatusFilter = '', allSearchText = '';

function afUnclassified() { return APP.unclassifiedOrders || []; }

function afAllOrders() {
  const list = [];
  afWarranty().forEach(o => list.push({ o: o, kind: 'WN', cat: '保内' }));
  afNonWarranty().forEach(o => list.push({ o: o, kind: 'NW', cat: '保外' }));
  afUnclassified().forEach(o => list.push({ o: o, kind: 'U', cat: '未分类' }));
  return list;
}

// 筛选与状态选项统一按当前口径，避免老数据「已结算」和新口径「已报单」并列出现
function afDisplayStatus(x) {
  return x.kind === 'U' ? (x.o.status || '待归类') : AFG.normalizeStatus(x.kind, x.o.status);
}

function afCategoryBadge(cat) {
  const style = cat === '保内' ? 'background:#dbeafe;color:#1e40af'
    : cat === '保外' ? 'background:#dcfce7;color:#166534'
    : 'background:#fef3c7;color:#92400e';
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;${style}">${afEsc(cat)}</span>`;
}

// 等待天数优先取派单留痕时间，其次取登记日期
function afWaitDays(o) {
  const audit = Array.isArray(o.audit) ? o.audit : [];
  const dispatch = audit.slice().reverse().find(a => a.action === 'dispatch');
  const base = (dispatch && dispatch.at) || o.dispatchDate || o.registerDate || '';
  const t = Date.parse(base);
  if (!isFinite(t)) return 0;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

// 已接单但未开始维修：今天接的是下周的单时，这里会按等待天数标出来
function afAcceptedPending() {
  return afAllOrders()
    .filter(x => x.kind === 'WN' && x.o.status === '已接单' && !x.o.startDate)
    .map(x => Object.assign({}, x, { days: afWaitDays(x.o) }))
    .sort((a, b) => b.days - a.days);
}

function renderAcceptedPending(list) {
  if (!list.length) return '<div style="color:var(--text-secondary);font-size:13px;padding:6px 2px">✅ 暂无「已接单未进行」的工单</div>';
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px">' +
    list.slice(0, 24).map(x => {
      const warn = x.days >= 3;
      return `<div style="border:1px solid ${warn ? '#f59e0b' : 'var(--border)'};background:${warn ? '#fffbeb' : '#fff'};border-radius:8px;padding:9px 11px">
        <div style="font-weight:600;font-size:13px">${afEsc(x.o.id)} · ${afEsc(x.o.engineer || '未指派')}</div>
        <div style="font-size:12px;color:var(--text-secondary)">${afEsc(x.o.customerName || '—')} · ${afEsc(x.o.barcode || x.o.vehicleInfo || '—')}</div>
        <div style="font-size:12px;margin-top:4px;color:${warn ? '#b45309' : 'var(--text-secondary)'};font-weight:${warn ? '700' : '400'}">已等待 ${x.days} 天${warn ? ' · 需跟进' : ''}</div>
        ${x.o.platformNote ? `<div style="font-size:12px;margin-top:5px;padding:5px 7px;background:#f8fafc;border-radius:5px;color:var(--text-secondary)">中台备注：${afEsc(x.o.platformNote)}</div>` : ''}
      </div>`;
    }).join('') + '</div>';
}

// 工程师为空、尚未派工的工单：单独在待跟进区露出，避免漏派
function afUnassignedOrders() {
  // 只保留仍在流转中、且确实没有工程师的工单；已终止/已结清/已关单不再占用待派位
  return afAllOrders().filter(x => {
    const kind = x.kind;
    if (kind !== 'WN' && kind !== 'NW') return false;
    if (!AFG.isActive(kind, x.o.status)) return false;
    return kind === 'WN' ? !x.o.engineer : !x.o.repairEngineer;
  });
}

function renderUnassigned(list) {
  if (!list.length) return '<div style="color:var(--text-secondary);font-size:13px;padding:6px 2px">✅ 暂无工程师为空的工单</div>';
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px">' +
    list.slice(0, 24).map(x => {
      const note = x.o.platformNote || x.o.note || x.o.remark || '';
      const noteLabel = x.o.platformNote ? '中台备注' : '备注';
      return `
      <div style="border:1px solid var(--border);border-radius:8px;padding:9px 11px">
        <div style="font-weight:600;font-size:13px">${afEsc(x.o.id)} · <span style="color:#b45309">未派工</span></div>
        <div style="font-size:12px;color:var(--text-secondary)">${afEsc(x.o.customerName || x.o.signedCustomer || '—')} · ${afEsc(x.o.barcode || x.o.vehicleInfo || x.o.plateNumber || '—')}</div>
        ${note ? `<div style="font-size:12px;margin-top:5px;padding:5px 7px;background:#f8fafc;border-radius:5px;color:var(--text-secondary)">${noteLabel}：${afEsc(note)}</div>` : ''}
        <div style="font-size:12px;margin-top:6px;display:flex;gap:6px;align-items:center">
          <span style="color:var(--text-secondary)">${afEsc(x.o.status || '待处理')}</span>
          ${AFG.isReadonly(ME.role) ? '' : `<button class="btn btn-sm btn-outline" onclick="${x.kind === 'WN' ? `afOpenAction('WN','${afEsc(x.o.id)}','dispatch')` : `viewNonWarranty('${afEsc(x.o.id)}')`}">${x.kind === 'WN' ? '派单' : '查看'}</button>`}
        </div>
      </div>`;
    }).join('') + '</div>';
}

// 总览编号列点击：直接打开该类工单的详情，查看全部备注与留痕
function openOrderDetail(kind, id) {
  if (kind === 'WN') return viewWarranty(id);
  if (kind === 'NW') return viewNonWarranty(id);
  return openUnclassifiedForm(id);
}

function renderAllRows(list) {
  if (!list.length) return '<tr><td colspan="10" style="text-align:center;color:var(--text-secondary);padding:40px">暂无匹配工单</td></tr>';
  return list.map(x => {
    const o = x.o;
    const status = x.kind === 'U' ? (o.status || '待归类') : afStatusPill(x.kind, o);
    const actions = x.kind === 'U'
      ? `${AFG.isReadonly(ME.role) ? '' : `<button class="btn btn-sm btn-outline" onclick="openUnclassifiedForm('${afEsc(o.id)}')">编辑</button>`}
         <button class="btn btn-sm btn-outline" onclick="classifyUnclassified('${afEsc(o.id)}','WN')">归类保内</button>
         <button class="btn btn-sm btn-outline" onclick="classifyUnclassified('${afEsc(o.id)}','NW')">归类保外</button>`
      : afActionButtons(x.kind, o);
    return `<tr>
      <td style="font-weight:600"><a href="javascript:void(0)" onclick="openOrderDetail('${x.kind}','${afEsc(o.id)}')" style="color:var(--primary,#2563eb);cursor:pointer;text-decoration:none" title="查看该工单详情与全部备注">${afEsc(o.id || '-')}</a></td>
      <td>${afCategoryBadge(x.cat)}</td>
      <td>${afEsc(o.customerName || o.signedCustomer || '-')}</td>
      <td>${afEsc(o.vehicleInfo || o.plateNumber || '-')}</td>
      <td>${status}</td>
      <td>${afEsc((o.engineer || o.repairEngineer || '-') + ((o.coEngineers || []).length ? ' + ' + o.coEngineers.join('、') : ''))}</td>
      <td>${afEsc(o.registerDate || o.requestDate || '-')}</td>
      <td class="action-group" onclick="event.stopPropagation()">${actions}</td>
    </tr>`;
  }).join('');
}

    </div>

      </div>

function applyAllFilter() {
  let list = afAllOrders();
  if (allCatFilter && allCatFilter !== '全部') list = list.filter(x => x.cat === allCatFilter);
  if (allStatusFilter) list = list.filter(x => afDisplayStatus(x) === allStatusFilter);
  if (allSearchText) {
    const t = allSearchText.toLowerCase();
    list = list.filter(x => ((x.o.id || '') + (x.o.customerName || '') + (x.o.signedCustomer || '') + (x.o.vehicleInfo || '') + (x.o.plateNumber || '') + (x.o.faultDesc || '')).toLowerCase().includes(t));
  }
  const body = document.getElementById('allTableBody');
  if (body) body.innerHTML = renderAllRows(list);
}

function nextOrderId(prefix) {
  APP.idCounters[prefix] = (APP.idCounters[prefix] || 0) + 1;

// 未分类工单人工归类：进入对应台账后走各自原有流程，不破坏历史事实
function classifyUnclassified(id, target) {
  if (AFG.isReadonly(ME.role)) return showUploadStatus('当前岗位为只读，不能归类工单', 'error');
  const arr = APP.unclassifiedOrders || [];
  const idx = arr.findIndex(o => o.id === id);
  if (idx < 0) return showUploadStatus('未找到该未分类工单', 'error');
  const o = Object.assign({}, arr[idx]);
  if (target === 'WN') {
    if (!/^(WN-|NJ-)/.test(o.id || '')) o.id = nextOrderId('wn');
    o.customerName = o.customerName || o.signedCustomer || '';
    o.vehicleInfo = o.vehicleInfo || o.plateNumber || '';
    o.status = AFG.isKnownStatus('WN', o.status) && AFG.isActive('WN', o.status) ? o.status : '未派工';
    AFG.appendAudit(o, { action: 'classify', from: '未分类', to: o.status, actor: ME, note: '人工归类为保内' });
    APP.warrantyOrders.push(o);
  } else {
    if (!/^(NW-)/.test(o.id || '')) o.id = nextOrderId('nw');
    o.signedCustomer = o.signedCustomer || o.customerName || '';
    o.plateNumber = o.plateNumber || o.vehicleInfo || '';
    o.status = AFG.isKnownStatus('NW', o.status) && AFG.isActive('NW', o.status) ? o.status : '待客户确认';
    AFG.appendAudit(o, { action: 'classify', from: '未分类', to: o.status, actor: ME, note: '人工归类为保外' });
    APP.nonWarrantyOrders.push(o);
  }
  arr.splice(idx, 1);
  APP.unclassifiedOrders = arr;
  saveData(APP);
  closeModal();
  renderPage();
  showUploadStatus('已归入' + (target === 'WN' ? '保内' : '保外') + '工单', 'success');
}

// 真实站点每天首开自动推送一次；测试夹具（example.test）不自动发，避免误发消息
function digestAutoEnabled() {
  const h = (typeof location !== 'undefined' && location.hostname) || '';
  return /github\.io$/.test(h) || /^(localhost|127\.0\.0\.1)$/.test(h);
}
function sendPendingDigest(manual) {
  if (typeof DISPATCH_NOTIFY === 'undefined' || typeof DISPATCH_NOTIFY.sendDigest !== 'function') {
    if (manual) showUploadStatus('提醒模块未加载', 'error');
    return;
  }
  const pending = afAcceptedPending().map(x => ({ id: x.o.id, engineer: x.o.engineer, days: x.days }));
  if (!pending.length) { if (manual) showUploadStatus('暂无已接单未进行的工单', 'info'); return; }
  const today = todayStr();
  if (!manual && localStorage.getItem('nj_digest_sent_on') === today) return;
  localStorage.setItem('nj_digest_sent_on', today);
  DISPATCH_NOTIFY.sendDigest(pending, (ME && ME.name) || '').then(r => {
    if (manual) showUploadStatus(r.ok ? '待跟进清单已推送钉钉' : ('推送失败：' + r.msg), r.ok ? 'success' : 'error');
  });
}
function maybeSendDailyDigest(pending) {
  if (pending.length && digestAutoEnabled()) sendPendingDigest(false);
}

  const val = (id, fallback) => {
    const el = document.getElementById(id);
    return el ? el.value : (fallback === undefined ? '' : fallback);
  };
  // 建单表单只保留现场需要填的字段；其余字段保留原值，等对应责任步骤再录入
  const data = {
    registerDate: val('f_wn_registerDate', todayStr()),
    customerName: val('f_wn_customerName'),
    contact: val('f_wn_contact'),
    vehicleInfo: val('f_wn_vehicleInfo'),
    repairType: val('f_wn_repairType', '乘用车'),
    orderType: val('f_wn_orderType', 'EU5检测'),
    faultDesc: val('f_wn_faultDesc'),
    engineer: val('f_wn_engineer'),
    externalService: val('f_wn_externalService'),
    pm: val('f_wn_pm'),
    urgent: old.urgent || '0',
    needMaterial: old.needMaterial || '0',
    materialApplyDate: old.materialApplyDate || '',
    materialReceiveDate: old.materialReceiveDate || '',
    gssOrderNo: old.gssOrderNo || '',
    reporter: old.reporter || '',
    gssFee: old.gssFee || '',
    outWarrantyAmount: old.outWarrantyAmount || '',
    totalFee: old.totalFee || '',
    orderDate: old.orderDate || '',
    orderCost: old.orderCost || '',
    platformNote: val('f_wn_platformNote', old.platformNote || ''),
    warehouseNote: old.warehouseNote || '',
    oldPartNote: old.oldPartNote || ''
  };
  if (!editId) data.barcode = data.vehicleInfo;

  if(!data.customerName || !data.faultDesc) {
    alert('请填写必填项：客户名称、故障描述');
    return;
  }

  // 工单类型选「待分类」：不进保内流转台账，落入未分类池等待人工归类
  if (data.orderType === '待分类') {
    let prev = null;
    if (editId) {
      const oldIdx = APP.warrantyOrders.findIndex(o => o.id === editId);
      if (oldIdx >= 0) prev = APP.warrantyOrders.splice(oldIdx, 1)[0];
    }
    APP.unclassifiedOrders = APP.unclassifiedOrders || [];
    const u = Object.assign({}, prev || {}, data);
    u.orderType = '待分类';
    u.status = '待归类';
    u.statusRaw = '';
    u.category = '未分类';
    u.engineer = '';
    u.source = (prev && prev.source) ? prev.source : '手工新建';
    u.importDate = u.importDate || todayStr();
    u.dataVersion = DATA_VERSION;
    u.note = (u.note ? u.note + '；' : '') + '建单登记为待分类' +
      (data.engineer ? '（填报工程师：' + data.engineer + '）' : '');
    if (!u.id) {
      APP.idCounters.u = Number(APP.idCounters.u || 0) + 1;
      u.id = 'U-' + String(APP.idCounters.u).padStart(6, '0');
    }
    AFG.appendAudit(u, { action: editId ? 'edit' : 'create', from: editId ? ((prev && prev.status) || '') : '', to: '待归类', actor: ME, note: '工单类型选「待分类」' });
    APP.unclassifiedOrders.push(u);
    saveData(APP);
    closeModal();
    renderPage();
    showUploadStatus(editId ? '工单已更新并转入未分类' : '工单已登记为未分类，可在总览中归类到保内或保外', 'success');
    return;
  }

  let prevEngineer = '';
  if(editId) {
    const oldOrder = afFindOrder('WN', editId);
    prevEngineer = oldOrder ? (oldOrder.engineer || '') : '';
    const idx = APP.warrantyOrders.findIndex(o => o.id === editId);
    if(idx >= 0) Object.assign(APP.warrantyOrders[idx], data);
  } else {
    data.id = genId('wn');
    data.status = data.engineer ? '已接单' : '未派工';
    data.startDate = '';
    data.completeDate = '';
    data.engineerNote = '';
    data.engineerOutput = '';
    data.submitDate = '';
    data.orderSubmitDate = '';
    data.settledDate = '';
    data.oldPartReceiveDate = '';
    data.oldPartReturnDate = '';
    data.engineerPickDate = '';
    data.readyDate = '';
    data.flowTemplateVersion = AFG.WN_FLOW.version;
    data.flowTemplateEffectiveAt = AFG.WN_FLOW.effectiveAt;
    AFG.appendAudit(data, { action: 'create', from: '', to: data.status, actor: ME, note: '新建保内工单' });
    APP.warrantyOrders.push(data);
  }
  saveData(APP);
  closeModal();
  renderPage();
  // 建单时若已指定工程师，或编辑时更换了工程师，都视为派单，必须推送提醒
  if (data.engineer && data.engineer !== prevEngineer) {
    pushDispatchNotice('WN', data, data.engineer, editId ? '保内工单已更新' : '保内工单已创建');
  }
}

function saveNonWarranty(editId) {
  const data = {
    requestDate: document.getElementById('f_nw_requestDate').value,
    city: document.getElementById('f_nw_city').value,
    signedCustomer: document.getElementById('f_nw_signedCustomer').value,
    plateNumber: document.getElementById('f_nw_plateNumber').value,
    barcode: document.getElementById('f_nw_barcode').value,
    vin: document.getElementById('f_nw_vin').value,
    productPN: document.getElementById('f_nw_productPN').value,
    productType: document.getElementById('f_nw_productType').value,
    projectType: document.getElementById('f_nw_projectType').value,
    bizContact: document.getElementById('f_nw_bizContact').value,
    customerName: document.getElementById('f_nw_customerName').value,
    customerPhone: document.getElementById('f_nw_customerPhone').value,
    faultDesc: document.getElementById('f_nw_faultDesc').value,
    repairEngineer: document.getElementById('f_nw_repairEngineer').value,
    repairArea: document.getElementById('f_nw_repairArea').value,
    dealDate: document.getElementById('f_nw_dealDate').value,
    quoteTotal: document.getElementById('f_nw_quoteTotal').value,
    quoteReceivable: document.getElementById('f_nw_quoteReceivable').value,
    partsSale: document.getElementById('f_nw_partsSale').value,
    laborFee: document.getElementById('f_nw_laborFee').value,
    partsCost: document.getElementById('f_nw_partsCost').value,
    logisticsFee: document.getElementById('f_nw_logisticsFee').value,
    profitShare: document.getElementById('f_nw_profitShare').value,
    paymentMethod: document.getElementById('f_nw_paymentMethod').value,
    paymentStatus: document.getElementById('f_nw_paymentStatus').value,
    receivedAmount: document.getElementById('f_nw_receivedAmount').value,
    invoiceAmount: document.getElementById('f_nw_invoiceAmount').value,
    paymentDate: document.getElementById('f_nw_paymentDate').value,
    invoiceDate: document.getElementById('f_nw_invoiceDate').value,
    payCatl: document.getElementById('f_nw_payCatl').value,
    catlInvoice: document.getElementById('f_nw_catlInvoice').value,
    logisticsPayment: document.getElementById('f_nw_logisticsPayment').value,
    logisticsInvoice: document.getElementById('f_nw_logisticsInvoice').value,
    reviewNote: document.getElementById('f_nw_reviewNote').value,
    remark: document.getElementById('f_nw_remark').value,
  };

  if(!data.signedCustomer || !data.faultDesc) {
    alert('请填写必填项：签约客户名称、业务需求描述');
    return;
  }

  // auto-calc
  const qt = parseFloat(data.quoteTotal)||0;
  const qr = parseFloat(data.quoteReceivable)||0;
  const ra = parseFloat(data.receivedAmount)||0;
  data.unreceivedAmount = (qr - ra).toFixed(2);
  const pc = parseFloat(data.partsCost)||0;
  const lf = parseFloat(data.logisticsFee)||0;
  const ps = parseFloat(data.profitShare)||0;
  data.grossProfit = (ra - pc - lf - ps).toFixed(2);
  data.grossMargin = ra > 0 ? (data.grossProfit / ra * 100).toFixed(2) + '%' : '';

  let prevEngineer = '';
  if(editId) {
    const oldOrder = afFindOrder('NW', editId);
    prevEngineer = oldOrder ? (oldOrder.repairEngineer || '') : '';
    const idx = afIndexOfNw(editId);
    if(idx >= 0) Object.assign(APP.nonWarrantyOrders[idx], data);
  } else {
    data.id = genId('nw');
    data.status = '待客户确认';
    data.orderNo = '';
    data.flowTemplateVersion = AFG.NW_FLOW.version;
    data.flowTemplateEffectiveAt = AFG.NW_FLOW.effectiveAt;
    AFG.appendAudit(data, { action: 'create', from: '', to: data.status, actor: ME, note: '新建保外工单' });
    APP.nonWarrantyOrders.push(data);
  }
  saveData(APP);
  closeModal();
  renderPage();
  if (data.repairEngineer && data.repairEngineer !== prevEngineer) {
    pushDispatchNotice('NW', data, data.repairEngineer, '保外工单已保存');
  }
}

// 报单步骤：记录 GSS 信息，以及参与维修工程师的工时数与里程数。
// 默认只显示一组；需要多人协作时点「+」逐组追加，已填内容会自动保留。
let settleWorkerCount = 1;
let settleDraft = null;

function settleNames(o) {
  return Array.from(new Set([].concat(APP.engineers || [], [o.engineer, o.repairEngineer], o.coEngineers || []).filter(Boolean)));
}

function settleWorkerBlock(id, i, names) {
  const w = (settleDraft && settleDraft.workers && settleDraft.workers[i]) || {};
  const name = w.engineer || (i === 0 ? (settleDraft.defaultEngineer || '') : '');
  return `
    <div class="settle-worker" style="border-top:1px dashed var(--border);padding-top:10px;margin-top:4px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-weight:600;font-size:13px">参与维修工程师 ${i + 1}</div>
        ${i > 0 ? `<button type="button" class="btn btn-sm btn-outline" onclick="removeSettleWorkerRow('${afEsc(id)}',${i})">删除本组</button>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px">
        <select class="form-select" id="settle_worker_${i}">
          <option value="">-- 请选择 --</option>
          ${names.map(n => `<option value="${afEsc(n)}" ${name === n ? 'selected' : ''}>${afEsc(n)}</option>`).join('')}
        </select>
        <input class="form-input" type="number" step="0.1" id="settle_hours_${i}" value="${afEsc(w.hours || '')}" placeholder="工时数">
        <input class="form-input" type="number" step="0.1" id="settle_mileage_${i}" value="${afEsc(w.mileage || '')}" placeholder="里程数">
      </div>
    </div>`;
}

function renderSettleModal(id) {
  const o = APP.warrantyOrders.find(x => x.id === id);
  if (!o) return;
  const d = settleDraft || {};
  const names = settleNames(o);
  const blocks = [];
  for (let i = 0; i < settleWorkerCount; i++) blocks.push(settleWorkerBlock(id, i, names));
  showModal(`
    <div class="modal-header"><div class="modal-title">报单 - ${o.id}</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">报单员</label>
          <select class="form-select" id="settle_reporter"><option value="">-- 请选择 --</option>${APP.reporters.map(r => `<option value="${afEsc(r)}" ${d.reporter === r ? 'selected' : ''}>${afEsc(r)}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label class="form-label">GSS工单号</label><input class="form-input" id="settle_gssOrderNo" value="${afEsc(d.gssOrderNo || '')}"></div>
        <div class="form-group"><label class="form-label">GSS总费用(元)</label><input class="form-input" type="number" id="settle_gssFee" value="${afEsc(d.gssFee || '')}"></div>
      </div>
      <div id="settleWorkerList">${blocks.join('')}</div>
      <button type="button" class="btn btn-outline" style="margin-top:10px" onclick="addSettleWorkerRow('${afEsc(id)}')">+ 添加参与维修工程师</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmSettleWarranty('${afEsc(id)}')">确认报单</button>
    </div>
  `);
}

function settleWarranty(id) {
  const o = APP.warrantyOrders.find(x => x.id === id);
  if (!o) return;
  const saved = Array.isArray(o.settleWorkers) ? o.settleWorkers.slice() : [];
  settleWorkerCount = Math.max(1, saved.length);
  settleDraft = {
    reporter: o.reporter || '',
    gssOrderNo: o.gssOrderNo || '',
    gssFee: o.gssFee || '',
    defaultEngineer: o.engineer || '',
    workers: saved.length ? saved.slice(0, settleWorkerCount) : [{ engineer: o.engineer || '', hours: '', mileage: '' }]
  };
  renderSettleModal(id);
}

function collectSettleDraft() {
  if (!settleDraft) settleDraft = { workers: [] };
  const val = sid => (document.getElementById(sid) || {}).value || '';
  settleDraft.reporter = val('settle_reporter');
  settleDraft.gssOrderNo = val('settle_gssOrderNo');
  settleDraft.gssFee = val('settle_gssFee');
  const workers = [];
  for (let i = 0; i < settleWorkerCount; i++) {
    workers.push({ engineer: val('settle_worker_' + i), hours: val('settle_hours_' + i), mileage: val('settle_mileage_' + i) });
  }
  settleDraft.workers = workers;
}

function addSettleWorkerRow(id) {
  collectSettleDraft();
  settleWorkerCount++;
  renderSettleModal(id);
}

function removeSettleWorkerRow(id, i) {
  collectSettleDraft();
  if (settleWorkerCount <= 1) return;
  settleDraft.workers.splice(i, 1);
  settleWorkerCount--;
  renderSettleModal(id);
}

function confirmSettleWarranty(id) {
  const o = APP.warrantyOrders.find(x => x.id === id);
  if (!o) return;
  collectSettleDraft();
  o.reporter = settleDraft.reporter;
  o.gssOrderNo = settleDraft.gssOrderNo || o.gssOrderNo || '';
  o.gssFee = settleDraft.gssFee;
  o.settleWorkers = settleDraft.workers.filter(w => w.engineer || w.hours || w.mileage);
  // 旧字段（总费用/保外成交金额）不再录入，但保留历史值不被清空
  o.settledDate = todayStr();
  const who = o.settleWorkers.map(w => w.engineer).filter(Boolean).join('、') || '-';
  afCommit('WN', id, 'settle', { note: 'GSS总费用 ' + (o.gssFee || '-') + ' / 参与维修工程师 ' + who });
}

function saveWarehouseLog() {
  const relatedOrder = document.getElementById('wh_order').value;

  APP.idCounters.wh++;
  const log = {
    id: `WH-${String(APP.idCounters.wh).padStart(4,'0')}`,
    relatedOrder,
    type: document.getElementById('wh_type').value,
    material: document.getElementById('wh_material').value,
    quantity: document.getElementById('wh_quantity').value,
    applyDate: document.getElementById('wh_applyDate').value,
    receiveDate: document.getElementById('wh_receiveDate').value,
    oldPartReceive: document.getElementById('wh_oldPartReceive').value,
    oldPartReturn: document.getElementById('wh_oldPartReturn').value,
    note: document.getElementById('wh_note').value,
  };

  // sync back to warranty order
  const wo = APP.warrantyOrders.find(o => o.id === relatedOrder);
  if(wo) {
    if(log.type === '申领') {
      wo.needMaterial = '1';
      wo.materialApplyDate = log.applyDate;
    } else if(log.type === '领用') {
      wo.materialReceiveDate = log.receiveDate;
      wo.engineerPickDate = log.receiveDate;
    } else if(log.type === '旧件') {
      wo.oldPartReceiveDate = log.oldPartReceive;
      wo.oldPartReturnDate = log.oldPartReturn;
      wo.oldPartNote = (document.getElementById('wh_oldPartNote') || {}).value || wo.oldPartNote || '';
    }
    wo.warehouseNote = log.note;
  }

  APP.warehouseLogs.push(log);
  saveData(APP);
  closeModal();
  renderPage();
}
